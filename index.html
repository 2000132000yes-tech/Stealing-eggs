<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D 펫 타이쿤 & 스피드 런</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            user-select: none;
        }

        #gameCanvas {
            display: block;
            margin: 0 auto;
            background-color: #55aa55; /* Default Grassland */
        }

        /* UI Overlays */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Stage Title in Top Center */
        #stage-title {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid #ffcc00;
            border-radius: 20px;
            padding: 8px 25px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            pointer-events: auto;
        }

        /* HUD Top Left */
        .hud {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .hud-card {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #fff;
            border-radius: 12px;
            padding: 8px 15px;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        /* Gacha Modal Window */
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #222;
            border: 4px solid #ffcc00;
            border-radius: 20px;
            padding: 25px;
            width: 300px;
            text-align: center;
            color: white;
            display: none;
            pointer-events: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .modal h2 {
            margin-top: 0;
            color: #ffcc00;
        }

        .btn {
            background: #ff9900;
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn:hover {
            background: #ffaa22;
        }

        #gacha-result {
            margin: 15px 0;
            font-size: 20px;
            font-weight: bold;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-container">
        <!-- Stage Title -->
        <div id="stage-title">1단계: 잔디밭</div>

        <!-- HUD -->
        <div class="hud">
            <div class="hud-card">💰 <span id="gold-val">0</span></div>
            <div class="hud-card">⚡ 속도: <span id="speed-val">5</span></div>
            <div class="hud-card">🐾 펫: <span id="pet-val">0/3</span></div>
        </div>
    </div>

    <!-- Gacha Modal -->
    <div id="gacha-modal" class="modal">
        <h2>🥚 신비한 알 뽑기</h2>
        <p>비용: <span style="color:#ffcc00;">100 골드</span></p>
        <div id="gacha-result">?</div>
        <button class="btn" onclick="buyPet()">뽑기!</button>
        <button class="btn" style="background:#555;" onclick="closeModal()">닫기</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Canvas Size Adjust
        canvas.width = Math.min(window.innerWidth, 1000);
        canvas.height = Math.min(window.innerHeight, 700);

        // --- Audio System ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        // 런닝머신 속도 상승 효과음 ("똥!" 소리)
        function playSpeedUpSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(450, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        // --- Stage Definitions ---
        const STAGES = [
            { name: "1단계: 잔디밭", color: "#55aa55" },
            { name: "2단계: 정글", color: "#226622" },
            { name: "3단계: 설산", color: "#aabbcc" },
            { name: "4단계: 용암지대", color: "#551111" },
            { name: "5단계: 바다", color: "#115599" },
            { name: "6단계: 선사시대", color: "#775533" }
        ];

        const PET_TYPES = [
            { name: "🐻 아기곰", emoji: "🐻", income: 5 },
            { name: "🐰 분홍토끼", emoji: "🐰", income: 12 },
            { name: "🦊 여우", emoji: "🦊", income: 25 },
            { name: "🐲 드래곤", emoji: "🐲", income: 60 }
        ];

        // --- Game State ---
        let state = {
            gold: 0,
            baseSpeed: 5,
            currentSpeed: 5,
            hasEgg: false,
            pets: [],
            maxPets: 3,
            currentStageIdx: 0,
            lastTreadmillSound: 0
        };

        // --- Objects ---
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 20,
            emoji: "🐥"
        };

        const baseZone = {
            x: 100,
            y: 100,
            radius: 50
        };

        const treadmill = {
            x: canvas.width - 150,
            y: 100,
            width: 100,
            height: 120
        };

        const gachaStation = {
            x: canvas.width - 150,
            y: canvas.height - 150,
            radius: 40
        };

        const eggZone = {
            x: 100,
            y: canvas.height - 150,
            radius: 40
        };

        // Floating Text Effects List
        let floatingTexts = [];

        // Keys Input
        const keys = {};
        window.addEventListener('keydown', e => { initAudio(); keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        // --- Game Logic ---
        function addGold(amount) {
            state.gold += amount;
            document.getElementById('gold-val').innerText = state.gold;
            checkStageProgress();
        }

        function checkStageProgress() {
            // 300 골드마다 다음 스테이지로 변경
            const newIdx = Math.min(Math.floor(state.gold / 300), STAGES.length - 1);
            if (newIdx !== state.currentStageIdx) {
                state.currentStageIdx = newIdx;
                canvas.style.backgroundColor = STAGES[newIdx].color;
                document.getElementById('stage-title').innerText = STAGES[newIdx].name;
            }
        }

        function addFloatingText(text, x, y) {
            floatingTexts.push({
                text: text,
                x: x,
                y: y,
                alpha: 1.0,
                offsetY: 0
            });
        }

        // --- Modal & Gacha ---
        let autoCloseTimer = null;

        function openModal() {
            document.getElementById('gacha-modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('gacha-modal').style.display = 'none';
            if (autoCloseTimer) clearTimeout(autoCloseTimer);
        }

        function buyPet() {
            if (state.gold < 100) {
                alert("골드가 부족합니다!");
                return;
            }
            if (state.pets.length >= state.maxPets) {
                alert("펫 슬롯이 가득 찼습니다!");
                return;
            }

            state.gold -= 100;
            document.getElementById('gold-val').innerText = state.gold;

            const rand = Math.floor(Math.random() * PET_TYPES.length);
            const petData = PET_TYPES[rand];

            state.pets.push({
                ...petData,
                timer: 0
            });

            document.getElementById('pet-val').innerText = `${state.pets.length}/${state.maxPets}`;
            const resEl = document.getElementById('gacha-result');
            resEl.innerText = `🎉 ${petData.name} 획득!`;

            // 펫을 뽑고 1초 뒤에 알 뽑기창 자동 닫기
            if (autoCloseTimer) clearTimeout(autoCloseTimer);
            autoCloseTimer = setTimeout(() => {
                closeModal();
                resEl.innerText = "?";
            }, 1000);
        }

        // --- Render Functions ---
        function drawCircle(x, y, radius, color) {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.closePath();
        }

        function drawEmoji(emoji, x, y, size = 30) {
            ctx.font = `${size}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(emoji, x, y);
        }

        // --- Main Loop ---
        let lastTime = performance.now();

        function gameLoop(now) {
            const dt = (now - lastTime) / 1000;
            lastTime = now;

            // 1. Movement
            let dx = 0;
            let dy = 0;
            if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

            if (dx !== 0 || dy !== 0) {
                const len = Math.hypot(dx, dy);
                player.x += (dx / len) * state.currentSpeed;
                player.y += (dy / len) * state.currentSpeed;
            }

            // Canvas Boundary
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            // 2. Treadmill Check (속도 증가)
            if (player.x > treadmill.x && player.x < treadmill.x + treadmill.width &&
                player.y > treadmill.y && player.y < treadmill.y + treadmill.height) {
                
                state.baseSpeed += 0.03; // 속도 상승
                state.currentSpeed = state.hasEgg ? state.baseSpeed * 0.5 : state.baseSpeed;
                document.getElementById('speed-val').innerText = Math.floor(state.baseSpeed);

                // 속도 올라갈 때 "똥!" 소리 재생
                if (now - state.lastTreadmillSound > 200) {
                    playSpeedUpSound();
                    state.lastTreadmillSound = now;
                }
            }

            // 3. Egg Pickup Zone
            const distToEgg = Math.hypot(player.x - eggZone.x, player.y - eggZone.y);
            if (distToEgg < eggZone.radius && !state.hasEgg) {
                state.hasEgg = true;
                state.currentSpeed = state.baseSpeed * 0.5; // 알 들면 속도 절반
            }

            // 4. Base Zone (알 제출 & 원래 속도로 복구)
            const distToBase = Math.hypot(player.x - baseZone.x, player.y - baseZone.y);
            if (distToBase < baseZone.radius) {
                if (state.hasEgg) {
                    state.hasEgg = false;
                    
                    // 원래 속도로 정상 회복!
                    state.currentSpeed = state.baseSpeed;
                    
                    addGold(50);
                }
            }

            // 5. Gacha Station Contact
            const distToGacha = Math.hypot(player.x - gachaStation.x, player.y - gachaStation.y);
            if (distToGacha < gachaStation.radius) {
                if (document.getElementById('gacha-modal').style.display !== 'block') {
                    openModal();
                }
            }

            // 6. Update Pets Income & Positions
            state.pets.forEach((pet, idx) => {
                pet.timer += dt;
                if (pet.timer >= 3) { // 3초마다 골드 생성
                    pet.timer = 0;
                    addGold(pet.income);

                    // 펫 위치 계산 후 연두색 Floating Text 생성
                    const angle = (idx / state.pets.length) * Math.PI * 2 + now * 0.002;
                    const petX = player.x + Math.cos(angle) * 50;
                    const petY = player.y + Math.sin(angle) * 50;
                    addFloatingText(`+${pet.income}`, petX, petY);
                }
            });

            // --- DRAWING ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Base Zone
            drawCircle(baseZone.x, baseZone.y, baseZone.radius, 'rgba(0, 255, 136, 0.4)');
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#00ff88';
            ctx.stroke();
            drawEmoji("🏠", baseZone.x, baseZone.y);

            // Draw Treadmill
            ctx.fillStyle = '#333';
            ctx.fillRect(treadmill.x, treadmill.y, treadmill.width, treadmill.height);
            ctx.fillStyle = '#ffaa00';
            ctx.font = '16px Arial';
            ctx.fillText("런닝머신", treadmill.x + 50, treadmill.y + 60);

            // Draw Egg Field
            drawCircle(eggZone.x, eggZone.y, eggZone.radius, 'rgba(255, 170, 0, 0.4)');
            drawEmoji("🥚", eggZone.x, eggZone.y);

            // Draw Gacha Station
            drawCircle(gachaStation.x, gachaStation.y, gachaStation.radius, 'rgba(255, 204, 0, 0.5)');
            drawEmoji("🎁", gachaStation.x, gachaStation.y);

            // Draw Pets
            state.pets.forEach((pet, idx) => {
                const angle = (idx / state.pets.length) * Math.PI * 2 + now * 0.002;
                const petX = player.x + Math.cos(angle) * 50;
                const petY = player.y + Math.sin(angle) * 50;
                drawEmoji(pet.emoji, petX, petY, 25);
            });

            // Draw Player
            drawCircle(player.x, player.y, player.radius, '#ffdd00');
            drawEmoji(player.emoji, player.x, player.y, 28);

            // Draw Carried Egg
            if (state.hasEgg) {
                drawEmoji("🥚", player.x, player.y - 25, 20);
            }

            // Draw Floating Green Money Texts (+100 둥실 올라가며 흐려짐)
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.offsetY += 1; // 위로 이동
                ft.alpha -= 0.015; // 흐려짐

                if (ft.alpha <= 0) {
                    floatingTexts.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.font = 'bold 20px Arial';
                ctx.fillStyle = '#7cfc00'; // 연두색 글자
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 3;
                ctx.textAlign = 'center';
                
                const curY = ft.y - 20 - ft.offsetY;
                ctx.strokeText(ft.text, ft.x, curY);
                ctx.fillText(ft.text, ft.x, curY);
                ctx.restore();
            }

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>

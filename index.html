<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-select=none">
    <title>Steal An Egg - Egg Size & UI Fixed</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #camera {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform: scale(0.65);
            transform-origin: center center;
            will-change: transform;
        }

        /* 전체 맵 세로 길이: 24,100px */
        #world-map {
            position: absolute;
            top: 0;
            left: 0;
            width: 2000px;
            height: 24100px;
            will-change: transform;
        }

        /* Zone 컨테이너 */
        .zone-container {
            position: absolute;
            top: 0;
            left: 500px;
            width: 1000px;
            height: 22600px;
            display: flex;
            flex-direction: column;
            border-top: 24px solid #000000;
            border-left: 24px solid #000000;
            border-right: 24px solid #000000;
        }

        /* 단계별 세로 높이 */
        .zone-6 { height: 7500px; background-color: #f7a37b; position: relative; }
        .zone-5 { height: 5500px; background-color: #00a8e8; position: relative; }
        .zone-4 { height: 4000px; background-color: #262626; position: relative; }
        .zone-3 { height: 2800px; background-color: #ffffff; position: relative; }
        .zone-2 { height: 1800px; background-color: #1e5c1e; position: relative; }
        .zone-1 { height: 1000px; background-color: #72bf44; position: relative; }

        /* --- 알(Egg) 스타일 --- */
        .egg-item {
            position: absolute;
            /* 기본 SVG 크기 정의, JS에서 scale로 실제 크기 조정 */
            width: 100px; 
            height: 130px;
            transform-origin: center bottom; /* 크기 조정 기준점: 하단 중앙 */
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
            z-index: 80;
            pointer-events: none;
            will-change: transform, left, top;
        }

        .egg-item svg {
            width: 100%;
            height: 100%;
        }

        /* 빨간 구별선 */
        .red-divider {
            position: absolute;
            top: 22592px;
            left: 524px;
            width: 952px;
            height: 8px;
            background-color: #ff2222;
            z-index: 50;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
        }

        /* 하단 베이스 */
        .base-wrapper {
            position: absolute;
            top: 22600px;
            left: 0;
            width: 2000px;
            height: 1500px;
        }

        .main-base {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #9cd645;
            border-left: 24px solid #000000;
            border-right: 24px solid #000000;
            border-bottom: 24px solid #000000;
            border-radius: 0 0 32px 32px;
        }

        .inner-fence-rect {
            position: absolute;
            bottom: 60px;
            left: 500px;
            width: 1000px;
            height: 600px;
            border: 12px solid #5c3a1e;
            background-color: rgba(139, 90, 43, 0.12);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            border-radius: 4px;
            pointer-events: none;
        }

        /* 런닝머신 */
        .treadmill {
            position: absolute;
            top: 23260px;
            left: 540px;
            width: 110px;
            height: 160px;
            background: #2b2b2b;
            border: 4px solid #111;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            z-index: 60;
        }

        .treadmill-belt {
            position: absolute;
            top: 35px;
            left: 15px;
            width: 80px;
            height: 115px;
            background: repeating-linear-gradient(
                0deg,
                #1a1a1a,
                #1a1a1a 10px,
                #333333 10px,
                #333333 14px
            );
            border-radius: 6px;
            border: 2px solid #000;
            animation: beltRun 0.4s linear infinite;
        }

        @keyframes beltRun {
            0% { background-position: 0 0; }
            100% { background-position: 0 14px; }
        }

        .treadmill-console {
            position: absolute;
            top: 6px;
            left: 10px;
            width: 90px;
            height: 24px;
            background: #0d1b2a;
            border: 2px solid #415a77;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .treadmill-display {
            font-size: 10px;
            font-weight: bold;
            color: #00ffcc;
            font-family: monospace;
            letter-spacing: 0.5px;
        }

        .treadmill-handle-left, .treadmill-handle-right {
            position: absolute;
            top: 25px;
            width: 8px;
            height: 60px;
            background: #777;
            border: 1px solid #222;
            border-radius: 3px;
        }
        .treadmill-handle-left { left: 4px; }
        .treadmill-handle-right { right: 4px; }

        .shoulder-wall-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 524px;
            height: 24px;
            background-color: #000000;
        }

        .shoulder-wall-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 524px;
            height: 24px;
            background-color: #000000;
        }

        /* Pop-up */
        .speed-popup {
            position: absolute;
            font-size: 24px;
            font-weight: 900;
            color: #00e5ff;
            text-shadow: 
                -2px -2px 0 #000,  
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0 0 10px rgba(0, 229, 255, 0.9);
            pointer-events: none;
            z-index: 250;
            font-family: 'Arial Black', sans-serif;
            white-space: nowrap;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-out;
            opacity: 1;
        }

        /* 캐릭터 (40px * 40px) */
        #player {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #ffda79;
            border: 3px solid #ccae4f;
            border-radius: 10px;
            transform: translate(-50%, -50%);
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            will-change: left, top;
            transition: transform 0.2s ease, height 0.2s ease;
        }

        #player::after {
            content: '';
            position: absolute;
            top: 9px;
            left: 7px;
            width: 7px;
            height: 7px;
            background-color: #333;
            border-radius: 50%;
            box-shadow: 15px 0 0 #333;
        }

        /* 알 들기 모션 애니메이션 */
        @keyframes pickUpActive {
            0% { transform: translate(-50%, -50%) scaleY(1); }
            50% { transform: translate(-50%, -30%) scaleY(0.7); }
            100% { transform: translate(-50%, -50%) scaleY(1); }
        }

        .player-picking {
            animation: pickUpActive 0.3s ease-out;
        }

        /* UI 버튼 */
        #settings-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            background: #2b2d42;
            border: 3px solid #141522;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 300;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        #settings-btn SVG {
            width: 24px;
            height: 24px;
            fill: #edf2f4;
        }

        #speed-toggle-switch {
            position: absolute;
            top: 74px;
            left: 20px;
            width: 44px;
            height: 24px;
            background-color: #2dc653;
            border: 3px solid #141522;
            border-radius: 12px;
            cursor: pointer;
            z-index: 300;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: background-color 0.2s ease;
        }

        #speed-toggle-knob {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            background-color: #ffffff;
            border-radius: 50%;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #speed-toggle-switch.active { background-color: #e63946; }
        #speed-toggle-switch.active #speed-toggle-knob { transform: translateX(20px); }

        /* 설정 Modal */
        #settings-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 500;
            align-items: center;
            justify-content: center;
        }

        #settings-card {
            position: relative;
            width: 320px;
            background: #1e1e24;
            border: 3px solid #2b2d42;
            border-radius: 16px;
            padding: 20px;
            color: #ffffff;
        }

        #close-settings-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 32px;
            height: 32px;
            background: #e63946;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zoom-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #2b2d42;
        }

        .zoom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00e5ff;
            cursor: pointer;
        }

        #hud-container {
            position: absolute;
            bottom: 120px;
            left: 25px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 300;
            pointer-events: none;
        }

        .hud-item { display: flex; align-items: center; }
        .hud-icon { width: 24px; height: 24px; margin-right: 6px; }
        .hud-icon svg { width: 100%; height: 100%; }
        .hud-text { font-size: 18px; font-weight: 900; font-family: 'Arial Black', sans-serif; text-shadow: 0 2px 5px rgba(0,0,0,0.9); }

        #speed-display { color: #3a86ff; }
        #money-display { color: #70e000; }

        /* --- 컨트롤 UI 레이아웃 변경 (우측 하단 정렬) --- */
        #controls-container {
            position: absolute;
            bottom: 30px; /* 화면 하단 여백 */
            right: 30px;  /* 화면 우측 여백 */
            display: flex;
            flex-direction: column; /* 세로 배치 (위: 버튼, 아래: 조이스틱) */
            align-items: center;
            gap: 15px; /* 버튼과 조이스틱 사이 간격 */
            pointer-events: none;
            z-index: 200;
        }

        /* 조이스틱: 크기 절반 단축 (60px * 60px) */
        #joystick-wrapper {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            touch-action: none;
            pointer-events: auto;
            position: relative;
        }

        #joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 26px; /* 스틱 크기도 축소 */
            height: 26px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* 집기/놓기 버튼: 크기 약간 축소 및 조이스틱 위 배치 */
        #action-btn {
            display: none;
            width: 70px; /* 크기 축소 */
            height: 70px;
            background-color: rgba(255, 218, 121, 0.6);
            border: 4px solid #ccae4f;
            color: #ccae4f;
            border-radius: 50%;
            font-size: 16px; /* 글씨 크기 축소 */
            font-weight: 900;
            cursor: pointer;
            pointer-events: auto;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: background-color 0.1s, transform 0.1s;
        }

        #action-btn.can-pick { display: flex; }
        #action-btn.is-lifting {
            background-color: rgba(230, 57, 70, 0.6);
            border-color: #b32e38;
            color: #b32e38;
        }

    </style>
</head>
<body>

    <div id="game-viewport">
        <div id="settings-btn">
            <svg viewBox="0 0 24 24">
                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
            </svg>
        </div>

        <div id="speed-toggle-switch">
            <div id="speed-toggle-knob"></div>
        </div>

        <div id="camera">
            <div id="world-map">
                <div class="zone-container">
                    <div class="zone zone-6"></div>
                    <div class="zone zone-5"></div>
                    <div class="zone zone-4"></div>
                    <div class="zone zone-3"></div>
                    <div class="zone zone-2"></div>
                    <div class="zone zone-1"></div>
                </div>
                <div class="red-divider"></div>
                <div class="base-wrapper">
                    <div class="shoulder-wall-left"></div>
                    <div class="shoulder-wall-right"></div>

                        <div class="inner-fence-rect"></div>

                <div class="treadmill" id="treadmill">
                    <div class="treadmill-console">
                        <span class="treadmill-display" id="tm-screen">RUNNING</span>
                    </div>
                    <div class="treadmill-handle-left"></div>
                    <div class="treadmill-handle-right"></div>
                    <div class="treadmill-belt"></div>
                </div>

                <div id="egg-layer"></div>
                <div id="player"></div>
            </div>
        </div>

        <div id="hud-container">
            <div class="hud-item">
                <div class="hud-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 17C2 17 4 17 6 15C8 13 10 9 13 9C15 9 17 10 18 12C19 13 21 13.5 22 14V18H2V17Z" fill="#3a86ff" stroke="#004e92" stroke-width="1.5"/>
                        <path d="M2 18H22V20H2V18Z" fill="#e0e1dd"/>
                    </svg>
                </div>
                <div class="hud-text" id="speed-display">:10.00</div>
            </div>

            <div class="hud-item">
                <div class="hud-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="9" fill="#70e000" stroke="#38b000" stroke-width="2"/>
                        <circle cx="12" cy="12" r="6" fill="#ccff33" stroke="#38b000" stroke-width="1"/>
                        <text x="12" y="16" font-size="11" font-weight="900" fill="#208b00" text-anchor="middle">$</text>
                    </svg>
                </div>
                <div class="hud-text" id="money-display">:000</div>
            </div>
        </div>

        <!-- 우측 하단 컨트롤 컨테이너 -->
        <div id="controls-container">
            <!-- 집기/놓기 버튼 (위) -->
            <button id="action-btn">집기</button>
            
            <!-- 조이스틱 (아래, 크기 축소) -->
            <div id="joystick-wrapper">
                <div id="joystick-stick"></div>
            </div>
        </div>

        <div id="settings-modal">
            <div id="settings-card">
                <button id="close-settings-btn">✕</button>
                <div class="modal-title">설정 (Settings)</div>
                <div class="setting-row">
                    <span class="setting-label">시야 크기</span>
                    <div class="slider-container">
                        <input type="range" id="zoom-range" class="zoom-slider" min="1" max="100" value="50">
                        <span id="zoom-value-text" class="zoom-value">50</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const map = document.getElementById('world-map');
        const camera = document.getElementById('camera');
        const player = document.getElementById('player');
        const eggLayer = document.getElementById('egg-layer');
        const joystickWrapper = document.getElementById('joystick-wrapper');
        const joystickStick = document.getElementById('joystick-stick');
        const actionBtn = document.getElementById('action-btn');

        const speedDisplay = document.getElementById('speed-display');
        const tmScreen = document.getElementById('tm-screen');
        const speedToggleSwitch = document.getElementById('speed-toggle-switch');

        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const zoomRange = document.getElementById('zoom-range');
        const zoomValueText = document.getElementById('zoom-value-text');

        let playerX = 1000;
        let playerY = 23100;
        
        let speedValue = 10.0;
        let isSpeedFixed = false;
        let isActionFrozen = false;

        let isDragging = false;
        let moveX = 0;
        let moveY = 0;

        const RADIUS = 20; // 플레이어 반지름 (크기 40px)
        const WALL_THICK = 24;
        const MAP_HEIGHT = 24100;

        const TM_BOUNDS = { left: 540, right: 650, top: 23260, bottom: 23420 };

        let lastTreadmillTime = 0;

        const TOTAL_EGGS = 50;
        const eggList = [];
        let nearestEgg = null;
        let liftedEgg = null;

        function getEggSvgHTML(id) {
            return `
                <svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="eggGrad_${id}" cx="35%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="40%" stop-color="#ffeaa7"/>
                            <stop offset="85%" stop-color="#fdcb6e"/>
                            <stop offset="100%" stop-color="#e17055"/>
                        </radialGradient>
                    </defs>
                    <path d="M 50 5 C 20 5, 5 45, 5 80 C 5 110, 25 125, 50 125 C 75 125, 95 110, 95 80 C 95 45, 80 5, 50 5 Z" 
                          fill="url(#eggGrad_${id})" stroke="#d63031" stroke-width="4"/>
                    <ellipse cx="38" cy="35" rx="10" ry="16" fill="#ffffff" opacity="0.6" transform="rotate(-15 38 35)"/>
                </svg>
            `;
        }

        /* --- 알 크기 로직 수정 (최소 크기 보장 및 확대) --- */
        function getRandomEggSize() {
            // 플레이어 크기(40px)의 절반인 20px를 최소 기준으로 설정 (SVG 기본 width 100px 기준 scale 0.2)
            const minScale = 0.2; 
            const maxScale = 1.5; // 최대 크기 (SVG 기준 150px, 플레이어의 3.75배)
            
            // 작은 것이 많이 나오는 확률 가중치 (세제곱)
            const weightedRand = Math.pow(Math.random(), 3);
            
            // 스케일 범위 계산
            const scale = minScale + (weightedRand * (maxScale - minScale));
            
            // UI 표시용 숫자 (1.00 ~ 100.00 형식으로 변환)
            // minScale(0.2) -> 1.00, maxScale(1.5) -> 100.00
            const displaySize = 1 + ((scale - minScale) / (maxScale - minScale)) * 99;
            
            return {
                scale: parseFloat(scale.toFixed(3)),
                display: parseFloat(displaySize.toFixed(2))
            };
        }

        function initRandomEggs() {
            const minX = 500 + WALL_THICK + 50; // 알 크기 고려 여백 확대
            const maxX = 1500 - WALL_THICK - 50;
            const minY = WALL_THICK + 50;
            const maxY = 22600 - 50;

            for (let i = 0; i < TOTAL_EGGS; i++) {
                const randX = minX + Math.random() * (maxX - minX);
                const randY = minY + Math.random() * (maxY - minY);
                const sizeData = getRandomEggSize();

                const eggItem = document.createElement('div');
                eggItem.className = 'egg-item';
                eggItem.innerHTML = getEggSvgHTML(i);
                
                eggItem.style.left = `${randX}px`;
                eggItem.style.top = `${randY}px`;
                // 계산된 스케일 적용
                eggItem.style.transform = `translate(-50%, -100%) scale(${sizeData.scale})`;

                eggLayer.appendChild(eggItem);

                eggList.push({
                    id: i,
                    element: eggItem,
                    worldX: randX,
                    worldY: randY,
                    scale: sizeData.scale,
                    displaySize: sizeData.display,
                    isLifted: false
                });
            }
        }

        function checkNearestEgg() {
            if (liftedEgg) return;

            // 알 크기가 커졌으므로 감지 거리 확대
            const detectDist = 100; 
            let minPlayerDist = Infinity;
            let currentNearest = null;

            eggList.forEach(egg => {
                if (egg.isLifted) return;
                const dist = Math.hypot(playerX - egg.worldX, playerY - egg.worldY);
                if (dist < detectDist && dist < minPlayerDist) {
                    minPlayerDist = dist;
                    currentNearest = egg;
                }
            });

            nearestEgg = currentNearest;

            if (nearestEgg) {
                actionBtn.innerText = "집기";
                actionBtn.classList.add('can-pick');
                actionBtn.classList.remove('is-lifting');
            } else {
                actionBtn.classList.remove('can-pick');
            }
        }

        actionBtn.addEventListener('click', handleAction);

        function handleAction() {
            if (isActionFrozen) return;

            if (!liftedEgg) {
                if (!nearestEgg) return;
                liftedEgg = nearestEgg;
                liftedEgg.isLifted = true;
                nearestEgg = null;
                isActionFrozen = true;
                player.classList.add('player-picking');
                actionBtn.innerText = "놓기";
                actionBtn.classList.add('is-lifting');
                setTimeout(() => {
                    liftedEgg.element.style.zIndex = '110';
                    isActionFrozen = false;
                }, 200);
                setTimeout(() => { player.classList.remove('player-picking'); }, 300);
            } else {
                const dropEgg = liftedEgg;
                liftedEgg = null;
                isActionFrozen = true;
                player.classList.add('player-picking');
                actionBtn.innerText = "집기";
                actionBtn.classList.remove('is-lifting');
                setTimeout(() => {
                    dropEgg.worldX = playerX;
                    dropEgg.worldY = playerY;
                    dropEgg.element.style.zIndex = '80';
                    dropEgg.element.style.left = `${playerX}px`;
                    dropEgg.element.style.top = `${playerY}px`;
                    renderSingleEgg(dropEgg);
                    isActionFrozen = false;
                }, 200);
                setTimeout(() => { player.classList.remove('player-picking'); }, 300);
            }
        }

        function renderSingleEgg(eggData) {
            if (eggData.isLifted && liftedEgg === eggData) {
                eggData.element.style.left = `${playerX}px`;
                eggData.element.style.top = `${playerY}px`;
                // 들고 있을 때 높이 조정 (알 크기 scale 반영)
                const yOffset = -110 - (eggData.scale * 20); 
                eggData.element.style.transform = `translate(-50%, ${yOffset}%) scale(${eggData.scale})`;
            } else {
                eggData.element.style.transform = `translate(-50%, -100%) scale(${eggData.scale})`;
                eggData.isLifted = false;
            }
        }

        let currentScale = 0.65;
        function setZoom(val) {
            currentScale = 1.2 - (val - 1) * (1.0 / 99);
            camera.style.transform = `scale(${currentScale.toFixed(3)})`;
            zoomValueText.innerText = val;
        }
        zoomRange.addEventListener('input', (e) => { setZoom(e.target.value); });
        settingsBtn.addEventListener('click', () => { settingsModal.style.display = 'flex'; });
        closeSettingsBtn.addEventListener('click', () => { settingsModal.style.display = 'none'; });
        speedToggleSwitch.addEventListener('click', () => {
            isSpeedFixed = !isSpeedFixed;
            speedToggleSwitch.classList.toggle('active', isSpeedFixed);
        });
        function updateSpeedDisplay() { speedDisplay.innerText = `:${speedValue.toFixed(2)}`; }
        function createSpeedPopup(amount) {
            const popup = document.createElement('div');
            popup.className = 'speed-popup';
            popup.innerText = `👟 +${amount.toFixed(2)}`;
            popup.style.left = `${TM_BOUNDS.left + 25}px`;
            popup.style.top = `${TM_BOUNDS.top - 10}px`;
            map.appendChild(popup);
            requestAnimationFrame(() => {
                popup.style.transform = `translate(${(Math.random() - 0.5) * 100}px, ${-(60 + Math.random() * 40)}px) scale(1.15)`;
                popup.style.opacity = '0';
            });
            setTimeout(() => { if (popup.parentNode) popup.parentNode.removeChild(popup); }, 800);
        }
        function checkTreadmill(now) {
            const isOnTM = (playerX >= TM_BOUNDS.left && playerX <= TM_BOUNDS.right && playerY >= TM_BOUNDS.top && playerY <= TM_BOUNDS.bottom);
            if (isOnTM) {
                if (tmScreen.innerText !== "TRAIN..") { tmScreen.innerText = "TRAIN.."; lastTreadmillTime = now; }
                while (now - lastTreadmillTime >= 100) { speedValue += 0.01; updateSpeedDisplay(); createSpeedPopup(0.01); lastTreadmillTime += 100; }
            } else { tmScreen.innerText = "READY"; }
        }
        function isValidPosition(x, y) {
            if (y < WALL_THICK + RADIUS || y > MAP_HEIGHT - WALL_THICK - RADIUS) return false;
            if (y < 22600) { if (x < 500 + WALL_THICK + RADIUS || x > 1500 - WALL_THICK - RADIUS) return false; }
            else { if (x < WALL_THICK + RADIUS || x > 2000 - WALL_THICK - RADIUS) return false; if (y - RADIUS < 22600 + WALL_THICK) { if (x - RADIUS < 500 + WALL_THICK || x + RADIUS > 1500 - WALL_THICK) return false; } }
            return true;
        }
        function movePlayer(dx, dy) {
            if (isActionFrozen) return;
            const currentMoveSpeed = isSpeedFixed ? 10.0 : speedValue;
            const actualDx = dx * currentMoveSpeed;
            const actualDy = dy * currentMoveSpeed;
            const steps = Math.ceil(Math.hypot(actualDx, actualDy));
            if (steps === 0) return;
            for (let i = 0; i < steps; i++) {
                if (isValidPosition(playerX + actualDx / steps, playerY)) playerX += actualDx / steps;
                if (isValidPosition(playerX, playerY + actualDy / steps)) playerY += actualDy / steps;
            }
        }
        function renderMap() {
            map.style.transform = `translate3d(${-playerX}px, ${-playerY}px, 0)`;
            player.style.left = `${playerX}px`;
            player.style.top = `${playerY}px`;
            if (liftedEgg) renderSingleEgg(liftedEgg);
        }
        function handleStart(e) { isDragging = true; handleMove(e); }
        function handleMove(e) {
            if (!isDragging) return;
            const rect = joystickWrapper.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            let deltaX = clientX - (rect.left + rect.width / 2);
            let deltaY = clientY - (rect.top + rect.height / 2);
            const distance = Math.hypot(deltaX, deltaY);
            // 조이스틱 반지름 축소 반영 (30px)
            if (distance > 30) { deltaX = (deltaX / distance) * 30; deltaY = (deltaY / distance) * 30; }
            joystickStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
            moveX = deltaX / 30; moveY = deltaY / 30;
        }
        function handleEnd() { isDragging = false; moveX = 0; moveY = 0; joystickStick.style.transform = 'translate(-50%, -50%)'; }
        joystickWrapper.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        joystickWrapper.addEventListener('touchstart', handleStart);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);
        function gameLoop(now) {
            if (isDragging && !isActionFrozen) { movePlayer(moveX, moveY); renderMap(); }
            else if (liftedEgg || isActionFrozen) renderMap();
            checkTreadmill(now); checkNearestEgg(); requestAnimationFrame(gameLoop);
        }
        initRandomEggs(); setZoom(50); updateSpeedDisplay(); renderMap(); requestAnimationFrame(gameLoop);
    </script>
</body>
</html>

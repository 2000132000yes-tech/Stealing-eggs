<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-select=none">
    <title>Steal An Egg - World Map</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* 월드 맵 Container */
        #world-map {
            position: absolute;
            top: 0;
            left: 0;
            width: 2000px; /* 전체 맵 너비 기준 */
            will-change: transform;
        }

        /* 위쪽 구역 컨테이너 */
        .zone-container {
            width: 1000px;
            margin: 0 auto; /* 중앙 정렬 */
            display: flex;
            flex-direction: column;
            border: 6px solid #333333;
            border-bottom: none;
        }

        .zone {
            width: 100%;
            height: 700px;
        }

        /* 구역 색상 (위: 살구색 ~ 아래: 초록색) */
        .zone-6 { background-color: #f7a37b; }
        .zone-5 { background-color: #00a8e8; }
        .zone-4 { background-color: #121212; }
        .zone-3 { background-color: #ffffff; }
        .zone-2 { background-color: #1e5c1e; }
        .zone-1 { background-color: #72bf44; }

        /* 메인 베이스 */
        .main-base {
            width: 2000px;
            height: 600px;
            background-color: #9cd645;
            border: 6px solid #5a8a1c;
            border-radius: 32px 32px 0 0;
        }

        /* 화면 중앙 플레이어 */
        #player {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background-color: #ffda79;
            border: 3px solid #ccae4f;
            border-radius: 12px;
            transform: translate(-50%, -50%);
            z-index: 100;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        #player::after {
            content: '';
            position: absolute;
            top: 12px;
            left: 10px;
            width: 8px;
            height: 8px;
            background-color: #333;
            border-radius: 50%;
            box-shadow: 18px 0 0 #333;
        }

        /* 조이스틱 */
        #joystick-wrapper {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: rgba(0, 0, 0, 0.15);
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            touch-action: none;
            z-index: 200;
        }

        #joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(50, 50, 50, 0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-viewport">
        <div id="world-map">
            <div class="zone-container">
                <div class="zone zone-6"></div>
                <div class="zone zone-5"></div>
                <div class="zone zone-4"></div>
                <div class="zone zone-3"></div>
                <div class="zone zone-2"></div>
                <div class="zone zone-1"></div>
            </div>
            <div class="main-base"></div>
        </div>

        <div id="player"></div>

        <div id="joystick-wrapper">
            <div id="joystick-stick"></div>
        </div>
    </div>

    <script>
        const map = document.getElementById('world-map');
        const joystickWrapper = document.getElementById('joystick-wrapper');
        const joystickStick = document.getElementById('joystick-stick');

        // 플레이어 맵 내부 좌표 (월드 좌표계)
        let playerX = 1000; // 베이스 중앙 (0 ~ 2000px)
        let playerY = 4500; // 베이스 내부 (0 ~ 4800px)
        const speed = 7;

        let isDragging = false;
        let moveX = 0;
        let moveY = 0;

        // 맵 영역 치수 정의
        const BASE_W = 2000;
        const BASE_H = 600;
        const ZONE_W = 1000;
        const ZONE_H = 4200; // 700 * 6
        const TOTAL_H = 4800;
        const ZONE_LEFT = 500; // (2000 - 1000) / 2
        const ZONE_RIGHT = 1500; // 500 + 1000
        const P_RADIUS = 20; // 플레이어 충돌 반경

        // 위치 검사: 주어진 (x, y)가 맵 땅 내부에 있는지 정확히 확인
        function isInsideMap(x, y) {
            // 1. 위쪽 세로 구역 영역
            if (y >= P_RADIUS && y <= ZONE_H) {
                return (x >= ZONE_LEFT + P_RADIUS && x <= ZONE_RIGHT - P_RADIUS);
            }
            // 2. 아래쪽 메인 베이스 영역
            if (y > ZONE_H && y <= TOTAL_H - P_RADIUS) {
                return (x >= P_RADIUS && x <= BASE_W - P_RADIUS);
            }
            return false;
        }

        // 화면 이동 렌더링
        function renderMap() {
            const vpW = window.innerWidth;
            const vpH = window.innerHeight;

            // 플레이어를 항상 화면 중앙에 고정하도록 맵 좌표 역산
            const mapLeft = (vpW / 2) - playerX;
            const mapTop = (vpH / 2) - playerY;

            map.style.transform = `translate3d(${mapLeft}px, ${mapTop}px, 0)`;
        }

        // 조이스틱 핸들러
        function handleStart(e) {
            isDragging = true;
            handleMove(e);
        }

        function handleMove(e) {
            if (!isDragging) return;

            const rect = joystickWrapper.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            let deltaX = clientX - centerX;
            let deltaY = clientY - centerY;
            const distance = Math.hypot(deltaX, deltaY);
            const maxRadius = 35;

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            joystickStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;

            moveX = deltaX / maxRadius;
            moveY = deltaY / maxRadius;
        }

        function handleEnd() {
            isDragging = false;
            moveX = 0;
            moveY = 0;
            joystickStick.style.transform = 'translate(-50%, -50%)';
        }

        joystickWrapper.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        joystickWrapper.addEventListener('touchstart', handleStart);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);

        // 메인 게임 루프 (독립 축 슬라이딩 이동 처리)
        function gameLoop() {
            if (isDragging) {
                const nextX = playerX + (moveX * speed);
                const nextY = playerY + (moveY * speed);

                // X축 이동 시도
                if (isInsideMap(nextX, playerY)) {
                    playerX = nextX;
                }
                // Y축 이동 시도 (벽에 부딪혀도 한쪽 방향으로 부드럽게 미끄러짐)
                if (isInsideMap(playerX, nextY)) {
                    playerY = nextY;
                }

                renderMap();
            }
            requestAnimationFrame(gameLoop);
        }

        // 초기 화면 배치
        renderMap();
        gameLoop();
    </script>
</body>
</html>

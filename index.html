<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-select=none">
    <title>Steal An Egg - World Map</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 줌 축소 시점 (0.65배율) */
        #camera {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform: scale(0.65);
            transform-origin: center center;
            will-change: transform;
        }

        /* 월드 맵 전체 */
        #world-map {
            position: absolute;
            top: 0;
            left: 0;
            width: 2000px;
            height: 5200px;
            will-change: transform;
        }

        /* 1~6 구역 (검은색 테두리 벽 24px) */
        .zone-container {
            width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            border-top: 24px solid #000000;
            border-left: 24px solid #000000;
            border-right: 24px solid #000000;
        }

        .zone {
            width: 100%;
            height: 700px;
        }

        .zone-6 { background-color: #f7a37b; }
        .zone-5 { background-color: #00a8e8; }
        .zone-4 { background-color: #262626; }
        .zone-3 { background-color: #ffffff; }
        .zone-2 { background-color: #1e5c1e; }
        .zone-1 { background-color: #72bf44; }

        /* 베이스와 1구역 사이 빨간색 경계선 */
        .red-divider {
            position: absolute;
            top: 4200px;
            left: 500px;
            width: 1000px;
            height: 8px;
            background-color: #ff2222;
            z-index: 50;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
        }

        /* 세로 1000px 메인 베이스 */
        .base-wrapper {
            position: relative;
            width: 2000px;
            height: 1000px;
        }

        .main-base {
            width: 100%;
            height: 100%;
            background-color: #9cd645;
            border-left: 24px solid #000000;
            border-right: 24px solid #000000;
            border-bottom: 24px solid #000000;
            border-radius: 0 0 32px 32px;
        }

        /* 베이스 상단 좌/우 어깨 벽 */
        .shoulder-wall-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 500px;
            height: 24px;
            background-color: #000000;
        }

        .shoulder-wall-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 500px;
            height: 24px;
            background-color: #000000;
        }

        /* 화면 중앙 플레이어 */
        #player {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background-color: #ffda79;
            border: 3px solid #ccae4f;
            border-radius: 12px;
            transform: translate(-50%, -50%);
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        #player::after {
            content: '';
            position: absolute;
            top: 12px;
            left: 10px;
            width: 8px;
            height: 8px;
            background-color: #333;
            border-radius: 50%;
            box-shadow: 18px 0 0 #333;
        }

        /* 조이스틱 UI */
        #joystick-wrapper {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            touch-action: none;
            z-index: 200;
        }

        #joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-viewport">
        <div id="camera">
            <div id="world-map">
                <div class="zone-container">
                    <div class="zone zone-6"></div>
                    <div class="zone zone-5"></div>
                    <div class="zone zone-4"></div>
                    <div class="zone zone-3"></div>
                    <div class="zone zone-2"></div>
                    <div class="zone zone-1"></div>
                </div>
                <!-- 1구역과 베이스 경계선 빨간선 -->
                <div class="red-divider"></div>
                <div class="base-wrapper">
                    <div class="shoulder-wall-left"></div>
                    <div class="shoulder-wall-right"></div>
                    <div class="main-base"></div>
                </div>
            </div>
        </div>

        <div id="player"></div>

        <div id="joystick-wrapper">
            <div id="joystick-stick"></div>
        </div>
    </div>

    <script>
        const map = document.getElementById('world-map');
        const joystickWrapper = document.getElementById('joystick-wrapper');
        const joystickStick = document.getElementById('joystick-stick');

        let playerX = 1000;
        let playerY = 4700;
        const speed = 8;

        let isDragging = false;
        let moveX = 0;
        let moveY = 0;

        const RADIUS = 25;
        const WALL_THICK = 24;

        function isValidPosition(x, y) {
            if (y < WALL_THICK + RADIUS || y > 5200 - WALL_THICK - RADIUS) return false;

            if (y < 4200) {
                return (x >= 500 + WALL_THICK + RADIUS && x <= 1500 - WALL_THICK - RADIUS);
            }

            if (x < WALL_THICK + RADIUS || x > 2000 - WALL_THICK - RADIUS) return false;

            if (y - RADIUS < 4200 + WALL_THICK) {
                const inLeftShoulder = (x - RADIUS < 500 + WALL_THICK);
                const inRightShoulder = (x + RADIUS > 1500 - WALL_THICK);
                if (inLeftShoulder || inRightShoulder) return false;
            }

            return true;
        }

        function movePlayer(dx, dy) {
            const steps = Math.ceil(Math.hypot(dx, dy));
            if (steps === 0) return;

            const stepX = dx / steps;
            const stepY = dy / steps;

            for (let i = 0; i < steps; i++) {
                if (isValidPosition(playerX + stepX, playerY)) {
                    playerX += stepX;
                }
                if (isValidPosition(playerX, playerY + stepY)) {
                    playerY += stepY;
                }
            }
        }

        function renderMap() {
            map.style.transform = `translate3d(${-playerX}px, ${-playerY}px, 0)`;
        }

        function handleStart(e) {
            isDragging = true;
            handleMove(e);
        }

        function handleMove(e) {
            if (!isDragging) return;

            const rect = joystickWrapper.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            let deltaX = clientX - centerX;
            let deltaY = clientY - centerY;
            const distance = Math.hypot(deltaX, deltaY);
            const maxRadius = 35;

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            joystickStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;

            moveX = deltaX / maxRadius;
            moveY = deltaY / maxRadius;
        }

        function handleEnd() {
            isDragging = false;
            moveX = 0;
            moveY = 0;
            joystickStick.style.transform = 'translate(-50%, -50%)';
        }

        joystickWrapper.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        joystickWrapper.addEventListener('touchstart', handleStart);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);

        function gameLoop() {
            if (isDragging) {
                movePlayer(moveX * speed, moveY * speed);
                renderMap();
            }
            requestAnimationFrame(gameLoop);
        }

        renderMap();
        gameLoop();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-select=none">
    <title>Steal An Egg - World Map</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* 뷰포트 (화면) */
        #game-viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* 이동하는 전체 월드 맵 */
        #world-map {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform;
        }

        /* 위쪽 세로 연결 구역들 */
        .zone-container {
            width: 1000px; /* 구역 너비 */
            display: flex;
            flex-direction: column; /* 아래로 갈수록 숫자가 커지도록(베이스와 가까움) */
            border: 6px solid #333333;
            border-bottom: none;
        }

        .zone {
            width: 100%;
            height: 700px; /* 각 구역 높이 */
        }

        /* 구역 색상 (베이스와 가까운 순서: 초록(1) -> 살구(6)) */
        .zone-6 { background-color: #f7a37b; } /* 6. 약간 진한 살구색 (가장 멂) */
        .zone-5 { background-color: #00a8e8; } /* 5. 바다색 */
        .zone-4 { background-color: #121212; } /* 4. 검은색 */
        .zone-3 { background-color: #ffffff; } /* 3. 하얀색 */
        .zone-2 { background-color: #1e5c1e; } /* 2. 진한 초록 */
        .zone-1 { background-color: #72bf44; } /* 1. 초록 (베이스와 바로 연결) */

        /* 맨 아래 넓어진 연두색 메인 베이스 */
        .main-base {
            width: 2000px; /* 베이스 가로 크기 확대 */
            height: 600px;  /* 베이스 세로 크기 확대 */
            background-color: #9cd645;
            border: 6px solid #5a8a1c;
            border-radius: 32px 32px 0 0;
        }

        /* 화면 중앙 고정 캐릭터 */
        #player {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background-color: #ffda79;
            border: 3px solid #ccae4f;
            border-radius: 12px;
            transform: translate(-50%, -50%);
            z-index: 100;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        #player::after {
            content: '';
            position: absolute;
            top: 12px;
            left: 10px;
            width: 8px;
            height: 8px;
            background-color: #333;
            border-radius: 50%;
            box-shadow: 18px 0 0 #333;
        }

        /* 하단 조이스틱 */
        #joystick-wrapper {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: rgba(0, 0, 0, 0.15);
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            touch-action: none;
            z-index: 200;
        }

        #joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(50, 50, 50, 0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-viewport">
        <!-- 움직이는 월드 맵 -->
        <div id="world-map">
            <!-- 위쪽 구역 (살구색이 맨 위, 초록색이 맨 아래) -->
            <div class="zone-container">
                <div class="zone zone-6"></div>
                <div class="zone zone-5"></div>
                <div class="zone zone-4"></div>
                <div class="zone zone-3"></div>
                <div class="zone zone-2"></div>
                <div class="zone zone-1"></div>
            </div>
            <!-- 아래 메인 베이스 -->
            <div class="main-base"></div>
        </div>

        <!-- 화면 고정 캐릭터 -->
        <div id="player"></div>

        <!-- 조이스틱 -->
        <div id="joystick-wrapper">
            <div id="joystick-stick"></div>
        </div>
    </div>

    <script>
        const map = document.getElementById('world-map');
        const joystickWrapper = document.getElementById('joystick-wrapper');
        const joystickStick = document.getElementById('joystick-stick');

        let mapX = 0;
        let mapY = 0;
        const speed = 7;

        let isDragging = false;
        let moveX = 0;
        let moveY = 0;

        // 맵 치수 정보
        const baseWidth = 2000;
        const baseHeight = 600;
        const zoneWidth = 1000;
        const zoneHeight = 700 * 6; // 4200px
        const totalHeight = zoneHeight + baseHeight; // 4800px

        window.onload = () => {
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            // 시작 위치: 베이스 중앙
            mapX = (viewportWidth / 2) - (baseWidth / 2);
            mapY = (viewportHeight / 2) - (totalHeight - (baseHeight / 2));

            updateMapPosition();
        };

        // 이동 제한 (벽 경계 로직)
        function clampPosition(targetX, targetY) {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            // 현재 캐릭터의 relative Y 위치 (맵 기준)
            const playerRelY = centerY - targetY;

            let minX, maxX;

            // 베이스 영역에 위치할 때와 구역 영역에 위치할 때의 벽 가로 범위 분기
            if (playerRelY >= zoneHeight) {
                // 베이스 내부
                minX = centerX - baseWidth;
                maxX = centerX;
            } else {
                // 구역(Zone) 내부
                minX = centerX - (baseWidth / 2) - (zoneWidth / 2);
                maxX = centerX - (baseWidth / 2) + (zoneWidth / 2);
            }

            // 세로 경계 제한 (6구역 맨 위 ~ 베이스 맨 아래)
            const minY = centerY - totalHeight;
            const maxY = centerY;

            const clampedX = Math.max(minX, Math.min(maxX, targetX));
            const clampedY = Math.max(minY, Math.min(maxY, targetY));

            return { x: clampedX, y: clampedY };
        }

        function updateMapPosition() {
            const clamped = clampPosition(mapX, mapY);
            mapX = clamped.x;
            mapY = clamped.y;

            map.style.left = `${mapX}px`;
            map.style.top = `${mapY}px`;
        }

        function handleStart(e) {
            isDragging = true;
            handleMove(e);
        }

        function handleMove(e) {
            if (!isDragging) return;

            const rect = joystickWrapper.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            let deltaX = clientX - centerX;
            let deltaY = clientY - centerY;
            const distance = Math.hypot(deltaX, deltaY);
            const maxRadius = 35;

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            joystickStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;

            moveX = deltaX / maxRadius;
            moveY = deltaY / maxRadius;
        }

        function handleEnd() {
            isDragging = false;
            moveX = 0;
            moveY = 0;
            joystickStick.style.transform = 'translate(-50%, -50%)';
        }

        joystickWrapper.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        joystickWrapper.addEventListener('touchstart', handleStart);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);

        function gameLoop() {
            if (isDragging) {
                mapX -= moveX * speed;
                mapY -= moveY * speed;
                updateMapPosition();
            }
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>

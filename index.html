<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-select=none">
    <title>Steal An Egg - World Map</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; /* 맵 외곽을 어둡게 처리 */
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 월드 맵 Container */
        #world-map {
            position: absolute;
            top: 0;
            left: 0;
            width: 2000px;
            will-change: transform;
        }

        /* 위쪽 구역 컨테이너 (실제 검은색 벽 적용) */
        .zone-container {
            width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            border-top: 16px solid #000000;
            border-left: 16px solid #000000;
            border-right: 16px solid #000000;
        }

        .zone {
            width: 100%;
            height: 700px;
        }

        /* 구역 색상 */
        .zone-6 { background-color: #f7a37b; }
        .zone-5 { background-color: #00a8e8; }
        .zone-4 { background-color: #262626; } /* 검은색 구역 시각 구분을 위해 약간 조정 */
        .zone-3 { background-color: #ffffff; }
        .zone-2 { background-color: #1e5c1e; }
        .zone-1 { background-color: #72bf44; }

        /* 메인 베이스 (외곽 검은색 벽 적용) */
        .base-wrapper {
            position: relative;
            width: 2000px;
            height: 600px;
        }

        .main-base {
            width: 100%;
            height: 100%;
            background-color: #9cd645;
            border-left: 16px solid #000000;
            border-right: 16px solid #000000;
            border-bottom: 16px solid #000000;
            border-radius: 0 0 16px 16px;
        }

        /* 베이스 위쪽 중 1구역으로 통하지 않는 좌우 어깨 벽 */
        .shoulder-wall-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 500px;
            height: 16px;
            background-color: #000000;
        }

        .shoulder-wall-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 500px;
            height: 16px;
            background-color: #000000;
        }

        /* 화면 중앙 플레이어 */
        #player {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background-color: #ffda79;
            border: 3px solid #ccae4f;
            border-radius: 12px;
            transform: translate(-50%, -50%);
            z-index: 100;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        #player::after {
            content: '';
            position: absolute;
            top: 12px;
            left: 10px;
            width: 8px;
            height: 8px;
            background-color: #333;
            border-radius: 50%;
            box-shadow: 18px 0 0 #333;
        }

        /* 조이스틱 */
        #joystick-wrapper {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            touch-action: none;
            z-index: 200;
        }

        #joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-viewport">
        <div id="world-map">
            <div class="zone-container">
                <div class="zone zone-6"></div>
                <div class="zone zone-5"></div>
                <div class="zone zone-4"></div>
                <div class="zone zone-3"></div>
                <div class="zone zone-2"></div>
                <div class="zone zone-1"></div>
            </div>
            <div class="base-wrapper">
                <div class="shoulder-wall-left"></div>
                <div class="shoulder-wall-right"></div>
                <div class="main-base"></div>
            </div>
        </div>

        <div id="player"></div>

        <div id="joystick-wrapper">
            <div id="joystick-stick"></div>
        </div>
    </div>

    <script>
        const map = document.getElementById('world-map');
        const joystickWrapper = document.getElementById('joystick-wrapper');
        const joystickStick = document.getElementById('joystick-stick');

        let playerX = 1000;
        let playerY = 4500;
        const speed = 7;

        let isDragging = false;
        let moveX = 0;
        let moveY = 0;

        // 치수 및 완벽한 벽 판정 오프셋 (벽 두께 고려)
        const WALL = 20; // 벽 두께 여유값
        const P_PAD = 25; // 캐릭터 반지름
        const LIMIT_LEFT_BASE = WALL + P_PAD;            // 45px
        const LIMIT_RIGHT_BASE = 2000 - WALL - P_PAD;     // 1955px
        const LIMIT_LEFT_ZONE = 500 + WALL + P_PAD;       // 545px
        const LIMIT_RIGHT_ZONE = 1500 - WALL - P_PAD;     // 1455px
        const LIMIT_TOP = WALL + P_PAD;                   // 45px
        const LIMIT_BOTTOM = 4800 - WALL - P_PAD;         // 4755px
        const ZONE_BOTTOM = 4200;                         // 1구역 하단 경계

        // 이동하려는 위치가 맵 땅 내부인지 검사하는 정밀 로직
        function canMoveTo(x, y) {
            // 1. 전체 상하 세로 한계 검사
            if (y < LIMIT_TOP || y > LIMIT_BOTTOM) return false;

            // 2. 구역(Zone 1~6) 내부
            if (y <= ZONE_BOTTOM) {
                return (x >= LIMIT_LEFT_ZONE && x <= LIMIT_RIGHT_ZONE);
            }

            // 3. 메인 베이스 내부
            if (y > ZONE_BOTTOM) {
                return (x >= LIMIT_LEFT_BASE && x <= LIMIT_RIGHT_BASE);
            }

            return false;
        }

        function renderMap() {
            const vpW = window.innerWidth;
            const vpH = window.innerHeight;

            const mapLeft = (vpW / 2) - playerX;
            const mapTop = (vpH / 2) - playerY;

            map.style.transform = `translate3d(${mapLeft}px, ${mapTop}px, 0)`;
        }

        function handleStart(e) {
            isDragging = true;
            handleMove(e);
        }

        function handleMove(e) {
            if (!isDragging) return;

            const rect = joystickWrapper.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            let deltaX = clientX - centerX;
            let deltaY = clientY - centerY;
            const distance = Math.hypot(deltaX, deltaY);
            const maxRadius = 35;

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            joystickStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;

            moveX = deltaX / maxRadius;
            moveY = deltaY / maxRadius;
        }

        function handleEnd() {
            isDragging = false;
            moveX = 0;
            moveY = 0;
            joystickStick.style.transform = 'translate(-50%, -50%)';
        }

        joystickWrapper.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        joystickWrapper.addEventListener('touchstart', handleStart);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);

        function gameLoop() {
            if (isDragging) {
                const nextX = playerX + (moveX * speed);
                const nextY = playerY + (moveY * speed);

                // X축 이동
                if (canMoveTo(nextX, playerY)) {
                    playerX = nextX;
                }
                // Y축 이동
                if (canMoveTo(playerX, nextY)) {
                    playerY = nextY;
                }

                renderMap();
            }
            requestAnimationFrame(gameLoop);
        }

        renderMap();
        gameLoop();
    </script>
</body>
</html>

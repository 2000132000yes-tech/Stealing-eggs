<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-select=none">
    <title>Steal An Egg - Treadmill Floating Text</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 줌 축소 시점 (0.65배율) */
        #camera {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform: scale(0.65);
            transform-origin: center center;
            will-change: transform;
        }

        /* 월드 맵 전체 */
        #world-map {
            position: absolute;
            top: 0;
            left: 0;
            width: 2000px;
            height: 5700px;
            will-change: transform;
        }

        /* 1~6 구역 */
        .zone-container {
            position: absolute;
            top: 0;
            left: 500px;
            width: 1000px;
            height: 4200px;
            display: flex;
            flex-direction: column;
            border-top: 24px solid #000000;
            border-left: 24px solid #000000;
            border-right: 24px solid #000000;
        }

        .zone {
            width: 100%;
            height: 696px;
        }

        .zone-6 { background-color: #f7a37b; }
        .zone-5 { background-color: #00a8e8; }
        .zone-4 { background-color: #262626; }
        .zone-3 { background-color: #ffffff; }
        .zone-2 { background-color: #1e5c1e; }
        .zone-1 { background-color: #72bf44; }

        /* 베이스 경계 빨간선 */
        .red-divider {
            position: absolute;
            top: 4192px;
            left: 524px;
            width: 952px;
            height: 8px;
            background-color: #ff2222;
            z-index: 50;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
        }

        /* 메인 베이스 영역 */
        .base-wrapper {
            position: absolute;
            top: 4200px;
            left: 0;
            width: 2000px;
            height: 1500px;
        }

        .main-base {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #9cd645;
            border-left: 24px solid #000000;
            border-right: 24px solid #000000;
            border-bottom: 24px solid #000000;
            border-radius: 0 0 32px 32px;
        }

        /* 직사각형 울타리 */
        .inner-fence-rect {
            position: absolute;
            bottom: 60px;
            left: 500px;
            width: 1000px;
            height: 600px;
            border: 12px solid #5c3a1e;
            background-color: rgba(139, 90, 43, 0.12);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            border-radius: 4px;
            pointer-events: none;
        }

        /* 런닝머신 모델링 (울타리 위쪽 왼쪽) */
        .treadmill {
            position: absolute;
            top: 4860px;
            left: 540px;
            width: 110px;
            height: 160px;
            background: #2b2b2b;
            border: 4px solid #111;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            z-index: 60;
        }

        .treadmill-belt {
            position: absolute;
            top: 35px;
            left: 15px;
            width: 80px;
            height: 115px;
            background: repeating-linear-gradient(
                0deg,
                #1a1a1a,
                #1a1a1a 10px,
                #333333 10px,
                #333333 14px
            );
            border-radius: 6px;
            border: 2px solid #000;
            animation: beltRun 0.4s linear infinite;
        }

        @keyframes beltRun {
            0% { background-position: 0 0; }
            100% { background-position: 0 14px; }
        }

        .treadmill-console {
            position: absolute;
            top: 6px;
            left: 10px;
            width: 90px;
            height: 24px;
            background: #0d1b2a;
            border: 2px solid #415a77;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .treadmill-display {
            font-size: 10px;
            font-weight: bold;
            color: #00ffcc;
            font-family: monospace;
            letter-spacing: 0.5px;
        }

        .treadmill-handle-left, .treadmill-handle-right {
            position: absolute;
            top: 25px;
            width: 8px;
            height: 60px;
            background: #777;
            border: 1px solid #222;
            border-radius: 3px;
        }
        .treadmill-handle-left { left: 4px; }
        .treadmill-handle-right { right: 4px; }

        .shoulder-wall-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 524px;
            height: 24px;
            background-color: #000000;
        }

        .shoulder-wall-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 524px;
            height: 24px;
            background-color: #000000;
        }

        /* Floating pop-up text on Treadmill */
        .speed-popup {
            position: absolute;
            font-size: 16px;
            font-weight: 900;
            color: #00d4ff;
            text-shadow: 0 0 6px rgba(0, 212, 255, 0.8), 0 2px 4px #000000;
            pointer-events: none;
            z-index: 150;
            font-family: 'Arial Black', sans-serif;
            white-space: nowrap;
            transition: transform 0.8s ease-out, opacity 0.8s ease-out;
            opacity: 1;
        }

        /* 플레이어 캐릭 */
        #player {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background-color: #ffda79;
            border: 3px solid #ccae4f;
            border-radius: 12px;
            transform: translate(-50%, -50%);
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        #player::after {
            content: '';
            position: absolute;
            top: 12px;
            left: 10px;
            width: 8px;
            height: 8px;
            background-color: #333;
            border-radius: 50%;
            box-shadow: 18px 0 0 #333;
        }

        /* 좌측 상단 뭉툭한 정사각형 설정 버튼 */
        #settings-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            background: #2b2d42;
            border: 3px solid #141522;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 300;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        #settings-btn:active {
            transform: scale(0.92);
        }

        #settings-btn svg {
            width: 24px;
            height: 24px;
            fill: #edf2f4;
        }

        /* 좌측 하단 스탯 UI */
        #hud-container {
            position: absolute;
            bottom: 120px;
            left: 25px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 300;
            pointer-events: none;
        }

        .hud-item {
            display: flex;
            align-items: center;
            background: none;
            padding: 2px 0;
        }

        .hud-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 6px;
        }

        .hud-icon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        .hud-text {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 0.5px;
            font-family: 'Arial Black', sans-serif;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.9);
        }

        #speed-display {
            color: #3a86ff;
        }

        #money-display {
            color: #70e000;
        }

        /* 조이스틱 UI */
        #joystick-wrapper {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            touch-action: none;
            z-index: 200;
        }

        #joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-viewport">
        <!-- 왼쪽 위 구석 작고 뭉툭한 정사각형 설정 버튼 -->
        <div id="settings-btn">
            <svg viewBox="0 0 24 24">
                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
            </svg>
        </div>

        <div id="camera">
            <div id="world-map">
                <div class="zone-container">
                    <div class="zone zone-6"></div>
                    <div class="zone zone-5"></div>
                    <div class="zone zone-4"></div>
                    <div class="zone zone-3"></div>
                    <div class="zone zone-2"></div>
                    <div class="zone zone-1"></div>
                </div>
                <div class="red-divider"></div>
                <div class="base-wrapper">
                    <div class="shoulder-wall-left"></div>
                    <div class="shoulder-wall-right"></div>
                    <div class="main-base">
                        <div class="inner-fence-rect"></div>
                    </div>
                </div>

                <!-- 런닝머신 -->
                <div class="treadmill" id="treadmill">
                    <div class="treadmill-console">
                        <span class="treadmill-display" id="tm-screen">RUNNING</span>
                    </div>
                    <div class="treadmill-handle-left"></div>
                    <div class="treadmill-handle-right"></div>
                    <div class="treadmill-belt"></div>
                </div>
            </div>
        </div>

        <div id="player"></div>

        <!-- 좌측 하단 스탯 UI -->
        <div id="hud-container">
            <div class="hud-item">
                <div class="hud-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 17C2 17 4 17 6 15C8 13 10 9 13 9C15 9 17 10 18 12C19 13 21 13.5 22 14V18H2V17Z" fill="#3a86ff" stroke="#004e92" stroke-width="1.5"/>
                        <path d="M2 18H22V20H2V18Z" fill="#e0e1dd"/>
                    </svg>
                </div>
                <div class="hud-text" id="speed-display">:10.0</div>
            </div>

            <div class="hud-item">
                <div class="hud-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="9" fill="#70e000" stroke="#38b000" stroke-width="2"/>
                        <circle cx="12" cy="12" r="6" fill="#ccff33" stroke="#38b000" stroke-width="1"/>
                        <text x="12" y="16" font-size="11" font-weight="900" fill="#208b00" text-anchor="middle">$</text>
                    </svg>
                </div>
                <div class="hud-text" id="money-display">:000</div>
            </div>
        </div>

        <div id="joystick-wrapper">
            <div id="joystick-stick"></div>
        </div>
    </div>

    <script>
        const map = document.getElementById('world-map');
        const joystickWrapper = document.getElementById('joystick-wrapper');
        const joystickStick = document.getElementById('joystick-stick');
        const speedDisplay = document.getElementById('speed-display');
        const tmScreen = document.getElementById('tm-screen');

        let playerX = 1000;
        let playerY = 4700;
        let speedValue = 10.0;

        let isDragging = false;
        let moveX = 0;
        let moveY = 0;

        const RADIUS = 25;
        const WALL_THICK = 24;
        const MAP_HEIGHT = 5700;

        const TM_BOUNDS = {
            left: 540,
            right: 650,
            top: 4860,
            bottom: 5020
        };

        let treadmillTimer = null;

        function updateSpeedDisplay() {
            speedDisplay.innerText = `:${speedValue.toFixed(1)}`;
        }

        /* Floating 텍스트 애니메이션 생성 (+0.1 하늘색) */
        function createSpeedPopup(amount) {
            const popup = document.createElement('div');
            popup.className = 'speed-popup';
            popup.innerText = `👟 +${amount.toFixed(1)}`;

            // 런닝머신 중심 위치에 생성
            const startX = TM_BOUNDS.left + 30 + (Math.random() * 40 - 20);
            const startY = TM_BOUNDS.top + 50;

            popup.style.left = `${startX}px`;
            popup.style.top = `${startY}px`;

            map.appendChild(popup);

            // 무작위 방향 이동 계산
            const randomX = (Math.random() - 0.5) * 80; // 좌/우 -40 ~ +40
            const randomY = - (50 + Math.random() * 40); // 위쪽 -50 ~ -90

            requestAnimationFrame(() => {
                popup.style.transform = `translate(${randomX}px, ${randomY}px)`;
                popup.style.opacity = '0';
            });

            setTimeout(() => {
                if (popup.parentNode) {
                    popup.parentNode.removeChild(popup);
                }
            }, 850);
        }

        function checkTreadmill() {
            const isOnTM = (
                playerX >= TM_BOUNDS.left &&
                playerX <= TM_BOUNDS.right &&
                playerY >= TM_BOUNDS.top &&
                playerY <= TM_BOUNDS.bottom
            );

            if (isOnTM) {
                if (!treadmillTimer) {
                    tmScreen.innerText = "TRAIN..";
                    tmScreen.style.color = "#00ff66";
                    treadmillTimer = setInterval(() => {
                        speedValue += 0.1;
                        updateSpeedDisplay();
                        createSpeedPopup(0.1);
                    }, 100);
                }
            } else {
                if (treadmillTimer) {
                    clearInterval(treadmillTimer);
                    treadmillTimer = null;
                    tmScreen.innerText = "READY";
                    tmScreen.style.color = "#00ffcc";
                }
            }
        }

        function isValidPosition(x, y) {
            if (y < WALL_THICK + RADIUS || y > MAP_HEIGHT - WALL_THICK - RADIUS) return false;

            if (y < 4200) {
                if (x < 500 + WALL_THICK + RADIUS || x > 1500 - WALL_THICK - RADIUS) return false;
            } else {
                if (x < WALL_THICK + RADIUS || x > 2000 - WALL_THICK - RADIUS) return false;

                if (y - RADIUS < 4200 + WALL_THICK) {
                    if (x - RADIUS < 500 + WALL_THICK || x + RADIUS > 1500 - WALL_THICK) return false;
                }
            }

            return true;
        }

        function movePlayer(dx, dy) {
            const currentMoveSpeed = speedValue;
            const actualDx = dx * currentMoveSpeed;
            const actualDy = dy * currentMoveSpeed;

            const steps = Math.ceil(Math.hypot(actualDx, actualDy));
            if (steps === 0) return;

            const stepX = actualDx / steps;
            const stepY = actualDy / steps;

            for (let i = 0; i < steps; i++) {
                if (isValidPosition(playerX + stepX, playerY)) {
                    playerX += stepX;
                }
                if (isValidPosition(playerX, playerY + stepY)) {
                    playerY += stepY;
                }
            }

            checkTreadmill();
        }

        function renderMap() {
            map.style.transform = `translate3d(${-playerX}px, ${-playerY}px, 0)`;
        }

        function handleStart(e) {
            isDragging = true;
            handleMove(e);
        }

        function handleMove(e) {
            if (!isDragging) return;

            const rect = joystickWrapper.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            let deltaX = clientX - centerX;
            let deltaY = clientY - centerY;
            const distance = Math.hypot(deltaX, deltaY);
            const maxRadius = 35;

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            joystickStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;

            moveX = deltaX / maxRadius;
            moveY = deltaY / maxRadius;
        }

        function handleEnd() {
            isDragging = false;
            moveX = 0;
            moveY = 0;
            joystickStick.style.transform = 'translate(-50%, -50%)';
        }

        joystickWrapper.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        joystickWrapper.addEventListener('touchstart', handleStart);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);

        function gameLoop() {
            if (isDragging) {
                movePlayer(moveX, moveY);
                renderMap();
            } else {
                checkTreadmill();
            }
            requestAnimationFrame(gameLoop);
        }

        updateSpeedDisplay();
        renderMap();
        gameLoop();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-select=none">
    <title>Steal An Egg - World Map</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 줌 축소 시점 (0.65배율) */
        #camera {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform: scale(0.65);
            transform-origin: center center;
            will-change: transform;
        }

        /* 월드 맵 전체 */
        #world-map {
            position: absolute;
            top: 0;
            left: 0;
            width: 2000px;
            height: 4800px;
            will-change: transform;
        }

        /* 1~6 구역 (검은색 테두리 벽) */
        .zone-container {
            width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            border-top: 24px solid #000000;
            border-left: 24px solid #000000;
            border-right: 24px solid #000000;
        }

        .zone {
            width: 100%;
            height: 700px;
        }

        .zone-6 { background-color: #f7a37b; }
        .zone-5 { background-color: #00a8e8; }
        .zone-4 { background-color: #262626; }
        .zone-3 { background-color: #ffffff; }
        .zone-2 { background-color: #1e5c1e; }
        .zone-1 { background-color: #72bf44; }

        /* 베이스 영역 (검은색 테두리 벽) */
        .base-wrapper {
            position: relative;
            width: 2000px;
            height: 600px;
        }

        .main-base {
            width: 100%;
            height: 100%;
            background-color: #9cd645;
            border-left: 24px solid #000000;
            border-right: 24px solid #000000;
            border-bottom: 24px solid #000000;
            border-radius: 0 0 24px 24px;
        }

        /* 베이스 위쪽 막혀있는 좌/우 어깨 벽 */
        .shoulder-wall-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 500px;
            height: 24px;
            background-color: #000000;
        }

        .shoulder-wall-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 500px;
            height: 24px;
            background-color: #000000;
        }

        /* 화면 중앙 고정 캐릭터 */
        #player {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background-color: #ffda79;
            border: 3px solid #ccae4f;
            border-radius: 12px;
            transform: translate(-50%, -50%);
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        #player::after {
            content: '';
            position: absolute;
            top: 12px;
            left: 10px;
            width: 8px;
            height: 8px;
            background-color: #333;
            border-radius: 50%;
            box-shadow: 18px 0 0 #333;
        }

        /* 조이스틱 UI */
        #joystick-wrapper {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            touch-action: none;
            z-index: 200;
        }

        #joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-viewport">
        <div id="camera">
            <div id="world-map">
                <div class="zone-container">
                    <div class="zone zone-6"></div>
                    <div class="zone zone-5"></div>
                    <div class="zone zone-4"></div>
                    <div class="zone zone-3"></div>
                    <div class="zone zone-2"></div>
                    <div class="zone zone-1"></div>
                </div>
                <div class="base-wrapper">
                    <div class="shoulder-wall-left"></div>
                    <div class="shoulder-wall-right"></div>
                    <div class="main-base"></div>
                </div>
            </div>
        </div>

        <div id="player"></div>

        <div id="joystick-wrapper">
            <div id="joystick-stick"></div>
        </div>
    </div>

    <script>
        const map = document.getElementById('world-map');
        const joystickWrapper = document.getElementById('joystick-wrapper');
        const joystickStick = document.getElementById('joystick-stick');

        let playerX = 1000;
        let playerY = 4500;
        const speed = 8;

        let isDragging = false;
        let moveX = 0;
        let moveY = 0;

        // 안전 마진을 적용한 절대 바운더리 선언 (캐릭터 반지름 25px + 안전 두께)
        const P_PAD = 30; // 충돌 반지름을 30px로 늘려 완벽 차단

        const MIN_X_BASE = 24 + P_PAD;            // 54px
        const MAX_X_BASE = 2000 - 24 - P_PAD;     // 1946px
        
        const MIN_X_ZONE = 500 + 24 + P_PAD;       // 554px
        const MAX_X_ZONE = 1500 - 24 - P_PAD;      // 1446px

        const MIN_Y_WORLD = 24 + P_PAD;           // 54px
        const MAX_Y_WORLD = 4800 - 24 - P_PAD;    // 4746px
        
        const ZONE_BOTTOM_Y = 4200 - P_PAD;       // 4170px (1구역 영역)
        const BASE_TOP_Y = 4200 + 24 + P_PAD;     // 4254px (메인 베이스 내부 영역)

        // 1픽셀 위치의 유효성 검증 함수
        function isValidPosition(x, y) {
            // 맵 최외곽 천장/바닥
            if (y < MIN_Y_WORLD || y > MAX_Y_WORLD) return false;

            // 위쪽 1~6구역
            if (y <= ZONE_BOTTOM_Y) {
                return (x >= MIN_X_ZONE && x <= MAX_X_ZONE);
            }

            // 아래쪽 메인 베이스
            if (y >= BASE_TOP_Y) {
                return (x >= MIN_X_BASE && x <= MAX_X_BASE);
            }

            // 베이스-구역 연결 통로 (Y: 4170px ~ 4254px)
            return (x >= MIN_X_ZONE && x <= MAX_X_ZONE);
        }

        function renderMap() {
            map.style.transform = `translate3d(${-playerX}px, ${-playerY}px, 0)`;
        }

        function handleStart(e) {
            isDragging = true;
            handleMove(e);
        }

        function handleMove(e) {
            if (!isDragging) return;

            const rect = joystickWrapper.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            let deltaX = clientX - centerX;
            let deltaY = clientY - centerY;
            const distance = Math.hypot(deltaX, deltaY);
            const maxRadius = 35;

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            joystickStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;

            moveX = deltaX / maxRadius;
            moveY = deltaY / maxRadius;
        }

        function handleEnd() {
            isDragging = false;
            moveX = 0;
            moveY = 0;
            joystickStick.style.transform = 'translate(-50%, -50%)';
        }

        joystickWrapper.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        joystickWrapper.addEventListener('touchstart', handleStart);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);

        // Sub-stepping (세분화 검사) 루프
        function gameLoop() {
            if (isDragging) {
                const targetDx = moveX * speed;
                const targetDy = moveY * speed;
                const steps = Math.ceil(Math.hypot(targetDx, targetDy)); // Step 계산

                if (steps > 0) {
                    const stepDx = targetDx / steps;
                    const stepDy = targetDy / steps;

                    // 이동거리만큼 1픽셀 단위 미세 분할 검사
                    for (let i = 0; i < steps; i++) {
                        // X축 스텝 이동
                        if (isValidPosition(playerX + stepDx, playerY)) {
                            playerX += stepDx;
                        }
                        // Y축 스텝 이동
                        if (isValidPosition(playerX, playerY + stepDy)) {
                            playerY += stepDy;
                        }
                    }
                }

                renderMap();
            }
            requestAnimationFrame(gameLoop);
        }

        renderMap();
        gameLoop();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-select=none">
    <title>Steal An Egg - Hatch Bug Fixed</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #camera {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform: scale(0.65);
            transform-origin: center center;
            will-change: transform;
        }

        #world-map {
            position: absolute;
            top: 0;
            left: 0;
            width: 2000px;
            height: 24100px;
            will-change: transform;
        }

        .zone-container {
            position: absolute;
            top: 0;
            left: 500px;
            width: 1000px;
            height: 22600px;
            display: flex;
            flex-direction: column;
            border-top: 24px solid #000000;
            border-left: 24px solid #000000;
            border-right: 24px solid #000000;
        }

        .zone-6 { height: 7500px; background-color: #f7a37b; position: relative; }
        .zone-5 { height: 5500px; background-color: #00a8e8; position: relative; }
        .zone-4 { height: 4000px; background-color: #262626; position: relative; }
        .zone-3 { height: 2800px; background-color: #ffffff; position: relative; }
        .zone-2 { height: 1800px; background-color: #1e5c1e; position: relative; }
        .zone-1 { height: 1000px; background-color: #72bf44; position: relative; }

        .egg-item {
            position: absolute;
            width: 100px; 
            height: 130px;
            transform-origin: center bottom;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
            z-index: 80;
            pointer-events: none;
            will-change: transform, left, top;
        }

        .egg-item svg { width: 100%; height: 100%; overflow: visible; }

        .egg-weight-label {
            position: absolute;
            top: -28px;
            left: 50%;
            transform-origin: center center;
            font-size: 15px;
            font-weight: 900;
            color: #ffffff;
            background-color: rgba(0, 0, 0, 0.85);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1.5px solid #ffda79;
            white-space: nowrap;
            display: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
            z-index: 150;
            pointer-events: none; /* 클릭 이벤트를 방해하지 않도록 추가 */
        }

        .hatch-ready-icon {
            position: absolute;
            top: -55px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            font-weight: 900;
            color: #ff2222;
            text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff;
            animation: bounceReady 0.6s infinite alternate ease-in-out;
            display: none;
            z-index: 160;
            pointer-events: none; /* 클릭 이벤트를 방해하지 않도록 추가 */
        }

        @keyframes bounceReady {
            0% { transform: translateX(-50%) translateY(0); }
            100% { transform: translateX(-50%) translateY(-10px); }
        }

        .red-divider {
            position: absolute;
            top: 22592px;
            left: 524px;
            width: 952px;
            height: 8px;
            background-color: #ff2222;
            z-index: 50;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
        }

        .base-wrapper {
            position: absolute;
            top: 22600px;
            left: 0;
            width: 2000px;
            height: 1500px;
        }

        .main-base {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #9cd645;
            border-left: 24px solid #000000;
            border-right: 24px solid #000000;
            border-bottom: 24px solid #000000;
            border-radius: 0 0 32px 32px;
        }

        .inner-fence-rect {
            position: absolute;
            bottom: 60px;
            left: 500px;
            width: 1000px;
            height: 600px;
            border: 12px solid #5c3a1e;
            background-color: rgba(139, 90, 43, 0.12);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            border-radius: 4px;
            pointer-events: none;
        }

        .treadmill {
            position: absolute;
            top: 23260px;
            left: 540px;
            width: 110px;
            height: 160px;
            background: #2b2b2b;
            border: 4px solid #111;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            z-index: 60;
        }

        .treadmill-belt {
            position: absolute;
            top: 35px;
            left: 15px;
            width: 80px;
            height: 115px;
            background: repeating-linear-gradient(0deg, #1a1a1a, #1a1a1a 10px, #333333 10px, #333333 14px);
            border-radius: 6px;
            border: 2px solid #000;
            animation: beltRun 0.4s linear infinite;
        }

        @keyframes beltRun {
            0% { background-position: 0 0; }
            100% { background-position: 0 14px; }
        }

        .treadmill-console {
            position: absolute;
            top: 6px;
            left: 10px;
            width: 90px;
            height: 24px;
            background: #0d1b2a;
            border: 2px solid #415a77;
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
        }

        .treadmill-display { font-size: 10px; font-weight: bold; color: #00ffcc; font-family: monospace; letter-spacing: 0.5px; }
        .treadmill-handle-left, .treadmill-handle-right { position: absolute; top: 25px; width: 8px; height: 60px; background: #777; border: 1px solid #222; border-radius: 3px; }
        .treadmill-handle-left { left: 4px; }
        .treadmill-handle-right { right: 4px; }

        .shoulder-wall-left { position: absolute; top: 0; left: 0; width: 524px; height: 24px; background-color: #000000; }
        .shoulder-wall-right { position: absolute; top: 0; right: 0; width: 524px; height: 24px; background-color: #000000; }

        #player {
            position: absolute; width: 40px; height: 40px; background-color: #ffda79; border: 3px solid #ccae4f; border-radius: 10px; transform: translate(-50%, -50%); z-index: 100; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); will-change: left, top;
        }

        #player::after { content: ''; position: absolute; top: 9px; left: 7px; width: 7px; height: 7px; background-color: #333; border-radius: 50%; box-shadow: 15px 0 0 #333; }

        #settings-btn {
            position: absolute; 
            top: 20px; 
            left: 20px; 
            width: 44px; 
            height: 44px; 
            background: #2b2d42; 
            border: 3px solid #141522; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            z-index: 300; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        #settings-btn svg { width: 24px; height: 24px; fill: #edf2f4; }

        #speed-toggle-switch {
            position: absolute; top: 74px; left: 20px; width: 44px; height: 24px; background-color: #2dc653; border: 3px solid #141522; border-radius: 12px; cursor: pointer; z-index: 300; box-shadow: 0 4px 8px rgba(0,0,0,0.5); transition: background-color 0.2s ease;
        }

        #speed-toggle-knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background-color: #ffffff; border-radius: 50%; transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); }

        #speed-toggle-switch.active { background-color: #e63946; }
        #speed-toggle-switch.active #speed-toggle-knob { transform: translateX(20px); }

        #settings-modal {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: rgba(0, 0, 0, 0.65); 
            backdrop-filter: blur(4px); 
            z-index: 9999; 
            align-items: center; 
            justify-content: center;
        }

        #settings-card { 
            position: relative; 
            width: 300px; 
            background: #1e1e24; 
            border: 3px solid #3a3d52; 
            border-radius: 16px; 
            padding: 24px 20px; 
            color: #ffffff; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: #fff;
        }

        .setting-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .setting-label {
            font-size: 14px;
            color: #aaa;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #close-settings-btn { 
            position: absolute; 
            top: 12px; 
            right: 12px; 
            width: 32px; 
            height: 32px; 
            background: #e63946; 
            color: #fff; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
        }

        .zoom-slider { -webkit-appearance: none; width: 100%; height: 8px; border-radius: 4px; background: #2b2d42; outline: none; }
        .zoom-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #00e5ff; cursor: pointer; }
        .zoom-value { font-weight: bold; color: #00e5ff; width: 30px; text-align: right; }

        #hud-container { position: absolute; bottom: 120px; left: 25px; display: flex; flex-direction: column; gap: 6px; z-index: 300; pointer-events: none; }
        .hud-item { display: flex; align-items: center; }
        .hud-icon { width: 24px; height: 24px; margin-right: 6px; }
        .hud-icon svg { width: 100%; height: 100%; }
        .hud-text { font-size: 18px; font-weight: 900; font-family: 'Arial Black', sans-serif; text-shadow: 0 2px 5px rgba(0,0,0,0.9); }

        #speed-display { color: #3a86ff; }
        #money-display { color: #70e000; }

        #controls-container {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 300;
        }

        #joystick-wrapper {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.6);
            border: 6px solid rgba(0, 0, 0, 0.9);
            border-radius: 50%;
            touch-action: none;
            pointer-events: auto;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
        }

        #joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 1);
            border: 3px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        #action-btn {
            display: none;
            position: absolute;
            top: 0;
            right: 0;
            width: 80px;
            height: 80px;
            background-color: rgba(255, 218, 121, 0.95);
            border: 7px solid #ccae4f;
            color: #7d6b31;
            border-radius: 50%;
            font-size: 19px;
            font-weight: 900;
            cursor: pointer;
            pointer-events: auto;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.6);
            transition: background-color 0.1s, transform 0.1s;
        }

        #action-btn:active { transform: scale(0.95); }
        #action-btn.can-pick { display: flex; }
        #action-btn.is-lifting { display: flex; background-color: rgba(230, 57, 70, 0.95); border-color: #b32e38; color: #fff; }
        #action-btn.can-hatch { display: flex; background-color: rgba(45, 198, 83, 0.95); border-color: #1b8a37; color: #fff; }

    </style>
</head>
<body>

    <div id="game-viewport">
        <div id="settings-btn">
            <svg viewBox="0 0 24 24">
                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/>
            </svg>
        </div>

        <div id="speed-toggle-switch">
            <div id="speed-toggle-knob"></div>
        </div>

        <div id="camera">
            <div id="world-map">
                <div class="zone-container">
                    <div class="zone zone-6"></div>
                    <div class="zone zone-5"></div>
                    <div class="zone zone-4"></div>
                    <div class="zone zone-3"></div>
                    <div class="zone zone-2"></div>
                    <div class="zone zone-1"></div>
                </div>
                <div class="red-divider"></div>
                <div class="base-wrapper">
                    <div class="shoulder-wall-left"></div>
                    <div class="shoulder-wall-right"></div>
                    <div class="main-base">
                        <div class="inner-fence-rect"></div>
                    </div>
                </div>

                <div class="treadmill" id="treadmill">
                    <div class="treadmill-console">
                        <span class="treadmill-display" id="tm-screen">RUNNING</span>
                    </div>
                    <div class="treadmill-handle-left"></div>
                    <div class="treadmill-handle-right"></div>
                    <div class="treadmill-belt"></div>
                </div>

                <div id="egg-layer"></div>
                <div id="player"></div>
            </div>
        </div>

        <div id="hud-container">
            <div class="hud-item">
                <div class="hud-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 17C2 17 4 17 6 15C8 13 10 9 13 9C15 9 17 10 18 12C19 13 21 13.5 22 14V18H2V17Z" fill="#3a86ff" stroke="#004e92" stroke-width="1.5"/>
                        <path d="M2 18H22V20H2V18Z" fill="#e0e1dd"/>
                    </svg>
                </div>
                <div class="hud-text" id="speed-display">:10.00</div>
            </div>

            <div class="hud-item">
                <div class="hud-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="9" fill="#70e000" stroke="#38b000" stroke-width="2"/>
                        <circle cx="12" cy="12" r="6" fill="#ccff33" stroke="#38b000" stroke-width="1"/>
                        <text x="12" y="16" font-size="11" font-weight="900" fill="#208b00" text-anchor="middle">$</text>
                    </svg>
                </div>
                <div class="hud-text" id="money-display">:000</div>
            </div>
        </div>

        <div id="controls-container">
            <div id="joystick-wrapper">
                <div id="joystick-stick"></div>
            </div>
            <button id="action-btn">집기</button>
        </div>

        <div id="settings-modal">
            <div id="settings-card">
                <button id="close-settings-btn">✕</button>
                <div class="modal-title">설정 (Settings)</div>
                <div class="setting-row">
                    <span class="setting-label">시야 크기</span>
                    <div class="slider-container">
                        <input type="range" id="zoom-range" class="zoom-slider" min="1" max="100" value="50">
                        <span id="zoom-value-text" class="zoom-value">50</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const map = document.getElementById('world-map');
        const camera = document.getElementById('camera');
        const player = document.getElementById('player');
        const eggLayer = document.getElementById('egg-layer');
        const joystickWrapper = document.getElementById('joystick-wrapper');
        const joystickStick = document.getElementById('joystick-stick');
        const actionBtn = document.getElementById('action-btn');

        const speedDisplay = document.getElementById('speed-display');
        const tmScreen = document.getElementById('tm-screen');
        const speedToggleSwitch = document.getElementById('speed-toggle-switch');

        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const zoomRange = document.getElementById('zoom-range');
        const zoomValueText = document.getElementById('zoom-value-text');

        let playerX = 1000;
        let playerY = 23100;
        
        let speedValue = 10.0;
        let isSpeedFixed = false;

        let isDragging = false;
        let moveX = 0;
        let moveY = 0;

        const RADIUS = 20; 
        const WALL_THICK = 24;
        const MAP_HEIGHT = 24100;
        const RED_LINE_Y = 22592;

        // 울타리 부화 영역 설정
        const FENCE_BOUNDS = { left: 500, right: 1500, top: 23440, bottom: 24040 };
        const TM_BOUNDS = { left: 540, right: 650, top: 23260, bottom: 23420 };

        let lastTreadmillTime = 0;

        const eggList = [];
        let nearestEgg = null;
        let nearestHatchEgg = null;
        let liftedEgg = null;

        const ZONES_CONFIG = [
            { level: 6, name: "Zone 6", minY: 24, maxY: 7524 },
            { level: 5, name: "Zone 5", minY: 7524, maxY: 13024 },
            { level: 4, name: "Zone 4", minY: 13024, maxY: 17024 },
            { level: 3, name: "Zone 3", minY: 17024, maxY: 19824 },
            { level: 2, name: "Zone 2", minY: 19824, maxY: 21624 },
            { level: 1, name: "Zone 1", minY: 21624, maxY: 22600 }
        ];

        function getEggSvgHTML(id, zoneLevel) {
            let gradContent = '';
            let patternSVG = '';

            switch(zoneLevel) {
                case 1:
                    gradContent = `<stop offset="0%" stop-color="#ffffff"/><stop offset="60%" stop-color="#fbc531"/><stop offset="100%" stop-color="#e1b12c"/>`;
                    patternSVG = `<circle cx="35" cy="70" r="6" fill="#e84118" opacity="0.6"/><circle cx="65" cy="85" r="8" fill="#e84118" opacity="0.6"/><circle cx="50" cy="100" r="5" fill="#e84118" opacity="0.6"/>`;
                    break;
                case 2:
                    gradContent = `<stop offset="0%" stop-color="#eccc68"/><stop offset="50%" stop-color="#2ed573"/><stop offset="100%" stop-color="#26af5f"/>`;
                    patternSVG = `<path d="M 20 60 Q 50 50, 80 60 Q 50 70, 20 60" fill="#1e90ff" opacity="0.5"/><path d="M 15 85 Q 50 75, 85 85 Q 50 95, 15 85" fill="#1e90ff" opacity="0.5"/>`;
                    break;
                case 3:
                    gradContent = `<stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#a29bfe"/><stop offset="100%" stop-color="#6c5ce7"/>`;
                    patternSVG = `<path d="M 50 5 C 30 40, 30 90, 50 125" stroke="#fd79a8" stroke-width="6" fill="none" opacity="0.7"/><path d="M 35 15 C 15 45, 15 85, 30 115" stroke="#fd79a8" stroke-width="5" fill="none" opacity="0.7"/><path d="M 65 15 C 85 45, 85 85, 70 115" stroke="#fd79a8" stroke-width="5" fill="none" opacity="0.7"/>`;
                    break;
                case 4:
                    gradContent = `<stop offset="0%" stop-color="#636e72"/><stop offset="50%" stop-color="#2d3436"/><stop offset="100%" stop-color="#000000"/>`;
                    patternSVG = `<line x1="20" y1="40" x2="80" y2="100" stroke="#00cec9" stroke-width="6" opacity="0.8"/><line x1="30" y1="30" x2="90" y2="90" stroke="#ff7675" stroke-width="4" opacity="0.8"/>`;
                    break;
                case 5:
                    gradContent = `<stop offset="0%" stop-color="#ffffff"/><stop offset="50%" stop-color="#81ecec"/><stop offset="100%" stop-color="#0984e3"/>`;
                    patternSVG = `<polygon points="50,30 65,50 50,70 35,50" fill="#ffffff" opacity="0.7"/><polygon points="50,75 65,95 50,115 35,95" fill="#ffffff" opacity="0.7"/>`;
                    break;
                case 6:
                    gradContent = `<stop offset="0%" stop-color="#fff200"/><stop offset="50%" stop-color="#ff3838"/><stop offset="100%" stop-color="#c56cf0"/>`;
                    patternSVG = `<path d="M 55 20 L 35 60 L 55 60 L 40 105 L 70 50 L 50 50 Z" fill="#fff" opacity="0.85"/>`;
                    break;
            }

            return `
                <svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="eggGrad_${id}" cx="35%" cy="30%" r="70%">
                            ${gradContent}
                        </radialGradient>
                    </defs>
                    <path d="M 50 5 C 20 5, 5 45, 5 80 C 5 110, 25 125, 50 125 C 75 125, 95 110, 95 80 C 95 45, 80 5, 50 5 Z" 
                          fill="url(#eggGrad_${id})" stroke="#222222" stroke-width="4"/>
                    ${patternSVG}
                    <ellipse cx="38" cy="35" rx="10" ry="16" fill="#ffffff" opacity="0.5" transform="rotate(-15 38 35)"/>
                </svg>
            `;
        }

        function getRandomEggSize() {
            const minScale = 0.2; 
            const maxScale = 1.5; 
            const weightedRand = Math.pow(Math.random(), 12); 
            const scale = minScale + (weightedRand * (maxScale - minScale));
            const weight = (Math.pow(scale, 2.5) * 35).toFixed(1);
            return { scale: parseFloat(scale.toFixed(3)), weight: parseFloat(weight) };
        }

        function initRandomEggs() {
            const minX = 500 + WALL_THICK + 60;
            const maxX = 1500 - WALL_THICK - 60;
            let eggIdCounter = 0;

            ZONES_CONFIG.forEach(zone => {
                const zoneMinY = zone.minY + 60;
                const zoneMaxY = zone.maxY - 60;

                for (let i = 0; i < 5; i++) {
                    const randX = minX + Math.random() * (maxX - minX);
                    const randY = zoneMinY + Math.random() * (zoneMaxY - zoneMinY);
                    const sizeData = getRandomEggSize();
                    
                    const eggItem = document.createElement('div');
                    eggItem.className = 'egg-item';
                    eggItem.innerHTML = `
                        <div class="hatch-ready-icon" id="hatch-icon-${eggIdCounter}">!</div>
                        <div class="egg-weight-label" id="weight-label-${eggIdCounter}">${sizeData.weight.toFixed(1)}kg</div>
                        ${getEggSvgHTML(eggIdCounter, zone.level)}
                    `;
                    eggItem.style.left = `${randX}px`;
                    eggItem.style.top = `${randY}px`;
                    eggItem.style.transform = `translate(-50%, -100%) scale(${sizeData.scale})`;

                    const weightLabel = eggItem.querySelector('.egg-weight-label');
                    const hatchIcon = eggItem.querySelector('.hatch-ready-icon');
                    const invScale = (1 / sizeData.scale).toFixed(3);
                    weightLabel.style.transform = `translateX(-50%) scale(${invScale})`;
                    hatchIcon.style.transform = `translateX(-50%) scale(${invScale})`;

                    eggLayer.appendChild(eggItem);

                    eggList.push({ 
                        id: eggIdCounter, 
                        element: eggItem, 
                        weightLabel: weightLabel,
                        hatchIcon: hatchIcon,
                        worldX: randX, 
                        worldY: randY, 
                        scale: sizeData.scale, 
                        weight: sizeData.weight, 
                        zoneLevel: zone.level,
                        isLifted: false,
                        hasCrossedRedLine: false,
                        isIncubating: false,
                        remainingTime: 0,
                        isHatchReady: false
                    });

                    eggIdCounter++;
                }
            });
        }

        /* --- 근처 알 감지 및 버튼 상태 업데이트 --- */
        function checkNearestEgg() {
            if (liftedEgg) {
                actionBtn.innerText = "놓기";
                actionBtn.className = 'is-lifting';
                return;
            }

            const detectDist = 120; 
            let minDist = Infinity;
            let currentPickable = null;
            let currentHatchable = null;

            eggList.forEach(egg => {
                if (egg.isLifted) return;
                const dist = Math.hypot(playerX - egg.worldX, playerY - egg.worldY);
                if (dist < detectDist && dist < minDist) { 
                    minDist = dist; 
                    if (egg.isHatchReady) {
                        currentHatchable = egg;
                    } else if (!egg.isIncubating) {
                        currentPickable = egg;
                    }
                }
            });

            nearestHatchEgg = currentHatchable;
            nearestEgg = currentPickable;

            if (nearestHatchEgg) {
                actionBtn.innerText = "부화";
                actionBtn.className = 'can-hatch';
            } else if (nearestEgg) {
                actionBtn.innerText = "집기";
                actionBtn.className = 'can-pick';
            } else {
                actionBtn.className = '';
            }
        }

        actionBtn.addEventListener('click', handleAction);

        function handleAction() {
            // 1. 부화 시도
            if (nearestHatchEgg) {
                hatchEgg(nearestHatchEgg);
                nearestHatchEgg = null;
                actionBtn.className = '';
                return;
            }

            // 2. 알 집기
            if (!liftedEgg) {
                if (!nearestEgg) return;
                liftedEgg = nearestEgg; 
                liftedEgg.isLifted = true; 
                nearestEgg = null;
                
                liftedEgg.element.style.zIndex = '110';
                actionBtn.innerText = "놓기"; 
                actionBtn.className = 'is-lifting';
            } 
            // 3. 알 놓기 및 부화 타이머 시작 감지
            else {
                const dropEgg = liftedEgg; 
                liftedEgg = null;
                
                dropEgg.worldX = playerX; 
                dropEgg.worldY = playerY; 
                dropEgg.element.style.zIndex = '80'; 
                dropEgg.element.style.left = `${playerX}px`; 
                dropEgg.element.style.top = `${playerY}px`; 

                // 울타리 범위에 놓았는지 체크
                const isInFence = (
                    dropEgg.worldX >= FENCE_BOUNDS.left && 
                    dropEgg.worldX <= FENCE_BOUNDS.right && 
                    dropEgg.worldY >= FENCE_BOUNDS.top && 
                    dropEgg.worldY <= FENCE_BOUNDS.bottom
                );

                if (isInFence && !dropEgg.isIncubating && !dropEgg.isHatchReady) {
                    startIncubation(dropEgg);
                }

                actionBtn.innerText = "집기"; 
                actionBtn.className = '';
                
                renderSingleEgg(dropEgg);
            }
        }

        function startIncubation(egg) {
            egg.isIncubating = true;
            // 부화 테스트용: (zoneLevel * 3)초로 조정 (빠른 테스트 원할시 숫자를 줄이세요)
            const totalSeconds = Math.round((egg.zoneLevel * 5) + (egg.weight * 0.2));
            egg.remainingTime = totalSeconds;
        }

        /* --- 부화 처리 개선 --- */
        function hatchEgg(egg) {
            if (egg.element && egg.element.parentNode) {
                egg.element.parentNode.removeChild(egg.element);
            }
            const index = eggList.indexOf(egg);
            if (index > -1) {
                eggList.splice(index, 1);
            }
        }

        /* --- 타이머 로직 수정 (isIncubating 해제 보장) --- */
        function updateIncubationTimers() {
            eggList.forEach(egg => {
                if (egg.isIncubating && !egg.isHatchReady) {
                    egg.remainingTime -= 1;
                    if (egg.remainingTime <= 0) {
                        egg.remainingTime = 0;
                        egg.isIncubating = false; // 부화 대기 종료
                        egg.isHatchReady = true;  // 부화 준비 완료
                        egg.hatchIcon.style.display = 'block';
                        egg.weightLabel.style.display = 'none';
                    } else {
                        const m = Math.floor(egg.remainingTime / 60);
                        const s = egg.remainingTime % 60;
                        const timeStr = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                        egg.weightLabel.innerText = timeStr;
                        egg.weightLabel.style.display = 'block';
                    }
                }
            });
        }

        setInterval(updateIncubationTimers, 1000);

        function renderSingleEgg(eggData) {
            if (playerY >= RED_LINE_Y && eggData.isLifted) {
                eggData.hasCrossedRedLine = true;
            } else if (eggData.worldY >= RED_LINE_Y) {
                eggData.hasCrossedRedLine = true;
            }

            if (eggData.isLifted && liftedEgg === eggData) {
                eggData.element.style.left = `${playerX}px`; 
                eggData.element.style.top = `${playerY}px`;
                const yOffset = -110 - (eggData.scale * 15); 
                eggData.element.style.transform = `translate(-50%, ${yOffset}%) scale(${eggData.scale})`;
            } else { 
                eggData.element.style.transform = `translate(-50%, -100%) scale(${eggData.scale})`; 
                eggData.isLifted = false; 
            }

            if (eggData.isHatchReady) {
                eggData.hatchIcon.style.display = 'block';
                eggData.weightLabel.style.display = 'none';
            } else if (eggData.isIncubating) {
                eggData.weightLabel.style.display = 'block';
                eggData.hatchIcon.style.display = 'none';
            } else if (eggData.hasCrossedRedLine) {
                eggData.weightLabel.style.display = 'block';
                eggData.hatchIcon.style.display = 'none';
            } else {
                eggData.weightLabel.style.display = 'none';
                eggData.hatchIcon.style.display = 'none';
            }
        }

        let currentScale = 0.65;
        function setZoom(val) { currentScale = 1.2 - (val - 1) * (1.0 / 99); camera.style.transform = `scale(${currentScale.toFixed(3)})`; zoomValueText.innerText = val; }
        zoomRange.addEventListener('input', (e) => { setZoom(e.target.value); });
        
        settingsBtn.addEventListener('click', () => { settingsModal.style.display = 'flex'; });
        closeSettingsBtn.addEventListener('click', () => { settingsModal.style.display = 'none'; });

        speedToggleSwitch.addEventListener('click', () => { isSpeedFixed = !isSpeedFixed; speedToggleSwitch.classList.toggle('active', isSpeedFixed); });
        function updateSpeedDisplay() { speedDisplay.innerText = `:${speedValue.toFixed(2)}`; }
        
        function checkTreadmill(now) {
            const isOnTM = (playerX >= TM_BOUNDS.left && playerX <= TM_BOUNDS.right && playerY >= TM_BOUNDS.top && playerY <= TM_BOUNDS.bottom);
            if (isOnTM) {
                if (tmScreen.innerText !== "TRAIN..") { tmScreen.innerText = "TRAIN.."; lastTreadmillTime = now; }
                while (now - lastTreadmillTime >= 100) { speedValue += 0.01; updateSpeedDisplay(); lastTreadmillTime += 100; }
            } else { tmScreen.innerText = "READY"; }
        }

        function isValidPosition(x, y) {
            if (y < WALL_THICK + RADIUS || y > MAP_HEIGHT - WALL_THICK - RADIUS) return false;
            if (y < 22600) { if (x < 500 + WALL_THICK + RADIUS || x > 1500 - WALL_THICK - RADIUS) return false; }
            else { if (x < WALL_THICK + RADIUS || x > 2000 - WALL_THICK - RADIUS) return false; if (y - RADIUS < 22600 + WALL_THICK) { if (x - RADIUS < 500 + WALL_THICK || x + RADIUS > 1500 - WALL_THICK) return false; } }
            return true;
        }

        function movePlayer(dx, dy) {
            let currentMoveSpeed = isSpeedFixed ? 10.0 : speedValue;
            
            if (liftedEgg) {
                const scale = liftedEgg.scale; 
                const slowFactor = Math.max(0.1, 1 - (scale * 0.5)); 
                currentMoveSpeed *= slowFactor;
            }

            const actualDx = dx * currentMoveSpeed; 
            const actualDy = dy * currentMoveSpeed;
            const steps = Math.ceil(Math.hypot(actualDx, actualDy)); 
            if (steps === 0) return;

            for (let i = 0; i < steps; i++) {
                if (isValidPosition(playerX + actualDx / steps, playerY)) playerX += actualDx / steps;
                if (isValidPosition(playerX, playerY + actualDy / steps)) playerY += actualDy / steps;
            }
        }

        function renderMap() { map.style.transform = `translate3d(${-playerX}px, ${-playerY}px, 0)`; player.style.left = `${playerX}px`; player.style.top = `${playerY}px`; if (liftedEgg) renderSingleEgg(liftedEgg); }
        function handleStart(e) { isDragging = true; handleMove(e); }
        function handleMove(e) {
            if (!isDragging) return;
            const rect = joystickWrapper.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const centerX = rect.left + rect.width / 2; const centerY = rect.top + rect.height / 2;
            let deltaX = clientX - centerX; let deltaY = clientY - centerY;
            const distance = Math.hypot(deltaX, deltaY);
            
            const maxRadius = 60;
            if (distance > maxRadius) { deltaX = (deltaX / distance) * maxRadius; deltaY = (deltaY / distance) * maxRadius; }
            joystickStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
            moveX = deltaX / maxRadius; moveY = deltaY / maxRadius;
        }
        function handleEnd() { isDragging = false; moveX = 0; moveY = 0; joystickStick.style.transform = 'translate(-50%, -50%)'; }
        
        joystickWrapper.addEventListener('mousedown', handleStart); window.addEventListener('mousemove', handleMove); window.addEventListener('mouseup', handleEnd); joystickWrapper.addEventListener('touchstart', handleStart); joystickWrapper.addEventListener('touchmove', handleMove); joystickWrapper.addEventListener('touchend', handleEnd);
        function gameLoop(now) { if (isDragging) { movePlayer(moveX, moveY); renderMap(); } else if (liftedEgg) renderMap(); checkTreadmill(now); checkNearestEgg(); requestAnimationFrame(gameLoop); }
        initRandomEggs(); setZoom(50); updateSpeedDisplay(); renderMap(); requestAnimationFrame(gameLoop);
    </script>
</body>
</html>

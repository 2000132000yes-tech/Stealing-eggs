<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-select=none">
    <title>Steal An Egg - World Map</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 줌 축소 시점 (0.65배율) */
        #camera {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform: scale(0.65);
            transform-origin: center center;
            will-change: transform;
        }

        /* 월드 맵 전체 (총 세로 5200px = 구역 4200px + 베이스 1000px) */
        #world-map {
            position: absolute;
            top: 0;
            left: 0;
            width: 2000px;
            height: 5200px;
            will-change: transform;
        }

        /* 1~6 구역 (검은색 테두리 벽 24px) */
        .zone-container {
            width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            border-top: 24px solid #000000;
            border-left: 24px solid #000000;
            border-right: 24px solid #000000;
        }

        .zone {
            width: 100%;
            height: 700px;
        }

        .zone-6 { background-color: #f7a37b; }
        .zone-5 { background-color: #00a8e8; }
        .zone-4 { background-color: #262626; }
        .zone-3 { background-color: #ffffff; }
        .zone-2 { background-color: #1e5c1e; }
        .zone-1 { background-color: #72bf44; }

        /* 확장된 메인 베이스 (세로 1000px) */
        .base-wrapper {
            position: relative;
            width: 2000px;
            height: 1000px;
        }

        .main-base {
            width: 100%;
            height: 100%;
            background-color: #9cd645;
            border-left: 24px solid #000000;
            border-right: 24px solid #000000;
            border-bottom: 24px solid #000000;
            border-radius: 0 0 32px 32px;
        }

        /* 베이스 상단 좌/우 막힘 벽 */
        .shoulder-wall-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 500px;
            height: 24px;
            background-color: #000000;
        }

        .shoulder-wall-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 500px;
            height: 24px;
            background-color: #000000;
        }

        /* 화면 중앙 고정 캐릭터 */
        #player {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background-color: #ffda79;
            border: 3px solid #ccae4f;
            border-radius: 12px;
            transform: translate(-50%, -50%);
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        #player::after {
            content: '';
            position: absolute;
            top: 12px;
            left: 10px;
            width: 8px;
            height: 8px;
            background-color: #333;
            border-radius: 50%;
            box-shadow: 18px 0 0 #333;
        }

        /* 조이스틱 UI */
        #joystick-wrapper {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            touch-action: none;
            z-index: 200;
        }

        #joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-viewport">
        <div id="camera">
            <div id="world-map">
                <div class="zone-container">
                    <div class="zone zone-6"></div>
                    <div class="zone zone-5"></div>
                    <div class="zone zone-4"></div>
                    <div class="zone zone-3"></div>
                    <div class="zone zone-2"></div>
                    <div class="zone zone-1"></div>
                </div>
                <div class="base-wrapper">
                    <div class="shoulder-wall-left"></div>
                    <div class="shoulder-wall-right"></div>
                    <div class="main-base"></div>
                </div>
            </div>
        </div>

        <div id="player"></div>

        <div id="joystick-wrapper">
            <div id="joystick-stick"></div>
        </div>
    </div>

    <script>
        const map = document.getElementById('world-map');
        const joystickWrapper = document.getElementById('joystick-wrapper');
        const joystickStick = document.getElementById('joystick-stick');

        let playerX = 1000;
        let playerY = 4700; // 베이스 내부 시작
        const speed = 8;

        let isDragging = false;
        let moveX = 0;
        let moveY = 0;

        // 절대 충돌 한계선 (벽 두께 24px + 캐릭터 반경 25px = 49px 여유)
        const MARGIN = 49;
        const MIN_X_BASE = MARGIN;                 // 49px
        const MAX_X_BASE = 2000 - MARGIN;          // 1951px
        const MIN_X_ZONE = 500 + MARGIN;           // 549px
        const MAX_X_ZONE = 1500 - MARGIN;          // 1451px

        const MIN_Y_WORLD = MARGIN;                // 49px (최상단)
        const MAX_Y_WORLD = 5200 - MARGIN;         // 5151px (확장된 최하단 바닥)
        const GATE_Y = 4200;                       // 구역과 베이스의 경계선 Y값

        // 값 구속 함수 (Clamping)
        function clamp(val, min, max) {
            return Math.max(min, Math.min(max, val));
        }

        // 완벽 클램핑 이동 처리 (벽 절대 통과 불가)
        function updatePlayerPosition(dx, dy) {
            let nextX = playerX + dx;
            let nextY = playerY + dy;

            // 1. Y축 클램핑 (전체 맵 세로 범위 내)
            nextY = clamp(nextY, MIN_Y_WORLD, MAX_Y_WORLD);

            // 2. 위치 영역에 따른 X축 강제 클램핑
            if (nextY < GATE_Y) {
                // 구역 영역 (Zone 1~6): X축 549px ~ 1451px 구속
                nextX = clamp(nextX, MIN_X_ZONE, MAX_X_ZONE);
            } else if (nextY > GATE_Y + 24) {
                // 베이스 영역: X축 49px ~ 1951px 구속
                nextX = clamp(nextX, MIN_X_BASE, MAX_X_BASE);
            } else {
                // 통로 경계 구간 (Y=4200 ~ 4224): 베이스 좌우 어깨 벽에 막힘
                nextX = clamp(nextX, MIN_X_ZONE, MAX_X_ZONE);
            }

            playerX = nextX;
            playerY = nextY;
        }

        function renderMap() {
            map.style.transform = `translate3d(${-playerX}px, ${-playerY}px, 0)`;
        }

        function handleStart(e) {
            isDragging = true;
            handleMove(e);
        }

        function handleMove(e) {
            if (!isDragging) return;

            const rect = joystickWrapper.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            let deltaX = clientX - centerX;
            let deltaY = clientY - centerY;
            const distance = Math.hypot(deltaX, deltaY);
            const maxRadius = 35;

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            joystickStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;

            moveX = deltaX / maxRadius;
            moveY = deltaY / maxRadius;
        }

        function handleEnd() {
            isDragging = false;
            moveX = 0;
            moveY = 0;
            joystickStick.style.transform = 'translate(-50%, -50%)';
        }

        joystickWrapper.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        joystickWrapper.addEventListener('touchstart', handleStart);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);

        function gameLoop() {
            if (isDragging) {
                updatePlayerPosition(moveX * speed, moveY * speed);
                renderMap();
            }
            requestAnimationFrame(gameLoop);
        }

        renderMap();
        gameLoop();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 펫 타이쿤 & 스피드 런</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #000;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }

        /* Stage Title */
        #stage-title-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid #ffcc00;
            border-radius: 20px;
            padding: 8px 30px;
            color: #fff;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }

        /* Top HUD */
        .hud-top {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .hud-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            padding: 10px 20px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* Floating Text Effects Container */
        #floating-text-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-text {
            position: absolute;
            color: #7cfc00;
            font-size: 22px;
            font-weight: 900;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 2px 5px rgba(0,0,0,0.8);
            transform: translate(-50%, -100%);
            animation: floatUpFade 1.2s ease-out forwards;
        }

        @keyframes floatUpFade {
            0% {
                opacity: 1;
                transform: translate(-50%, 0);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -60px);
            }
        }

        /* Modal / Gacha System */
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 35, 0.95);
            border: 4px solid #ffcc00;
            border-radius: 25px;
            padding: 30px;
            width: 340px;
            text-align: center;
            color: white;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.4);
            display: none;
            pointer-events: auto;
            z-index: 100;
        }

        .modal h2 {
            margin-top: 0;
            color: #ffcc00;
            font-size: 28px;
        }

        .btn {
            background: linear-gradient(135deg, #ff9900, #ff5500);
            border: none;
            color: white;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 85, 0, 0.4);
            transition: all 0.2s;
            margin-top: 15px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 85, 0, 0.6);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Gacha Animation Display */
        #gacha-result {
            margin: 20px 0;
            font-size: 24px;
            font-weight: bold;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Bottom Controls Info */
        .controls-info {
            background: rgba(0, 0, 0, 0.5);
            color: #ccc;
            padding: 8px 15px;
            border-radius: 10px;
            font-size: 14px;
            align-self: center;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="hud-card">💰 골드: <span id="gold-display">0</span></div>
            <div class="hud-card">⚡ 속도: <span id="speed-display">10</span></div>
            <div class="hud-card">🐾 펫: <span id="pet-count-display">0/3</span></div>
        </div>

        <div id="stage-title-container">
            <span id="stage-title-text">1단계: 잔디밭</span>
        </div>

        <div class="controls-info">
            W, A, S, D 또는 화살표 키로 이동 | 런닝머신 위에서 이동 속도 증가!
        </div>
    </div>

    <div id="floating-text-container"></div>

    <!-- Gacha Modal -->
    <div id="gacha-modal" class="modal">
        <h2>🥚 신비한 알 뽑기</h2>
        <p>새로운 펫을 뽑아 골드 수급을 늘리세요!</p>
        <p>비용: <span style="color: #ffcc00; font-weight: bold;">100 골드</span></p>
        <div id="gacha-result">?</div>
        <button id="gacha-btn" class="btn" onclick="buyPet()">뽑기!</button>
        <button class="btn" style="background: #555; box-shadow: none;" onclick="closeGachaModal()">닫기</button>
    </div>

    <!-- Three.js & Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- Web Audio API (Sound System) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        // 런닝머신 속도 업 효과음 ("똥!" 소리)
        function playSpeedUpSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            // 통 하고 유쾌하게 튀는 피치 (500Hz -> 800Hz)
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        // 골드 획득 효과음
        function playCoinSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(987.77, audioCtx.currentTime); // B5
            osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.08); // E6

            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        // --- Game Data & Setup ---
        const STAGES = [
            { id: 1, name: "1단계: 잔디밭", color: 0x55aa55, wallColor: 0x338833 },
            { id: 2, name: "2단계: 정글", color: 0x226622, wallColor: 0x114411 },
            { id: 3, name: "3단계: 설산", color: 0xddffff, wallColor: 0xbbdddd },
            { id: 4, name: "4단계: 용암지대", color: 0x441111, wallColor: 0x882200 },
            { id: 5, name: "5단계: 바다", color: 0x115599, wallColor: 0x003366 },
            { id: 6, name: "6단계: 선사시대", color: 0x886644, wallColor: 0x553311 }
        ];

        const PET_TYPES = [
            { name: "🧋 아기 곰", color: 0x8B4513, income: 5, rarity: "일반" },
            { name: "🐰 분홍 토끼", color: 0xFFC0CB, income: 12, rarity: "희귀" },
            { name: "🦊 여우", color: 0xFF4500, income: 25, rarity: "영웅" },
            { name: "🐲 아기 드래곤", color: 0x9370DB, income: 60, rarity: "전설" }
        ];

        let state = {
            gold: 0,
            baseSpeed: 10,
            currentSpeed: 10,
            pets: [],
            maxPets: 3,
            hasEgg: false,
            currentStageIdx: 0,
            lastTreadmillStep: 0
        };

        // --- Scene, Camera, Renderer ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(STAGES[0].color);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 150;
        const d = 40;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // --- World Creation ---
        let groundMaterial, groundMesh;
        function createWorld() {
            // Floor
            const groundGeo = new THREE.PlaneGeometry(100, 100);
            groundMaterial = new THREE.MeshStandardMaterial({ 
                color: STAGES[0].color, 
                roughness: 0.8 
            });
            groundMesh = new THREE.Mesh(groundGeo, groundMaterial);
            groundMesh.rotation.x = -Math.PI / 2;
            groundMesh.receiveShadow = true;
            scene.add(groundMesh);

            // Grid decoration
            const grid = new THREE.GridHelper(100, 20, 0x000000, 0x000000);
            grid.position.y = 0.01;
            grid.material.opacity = 0.1;
            grid.material.transparent = true;
            scene.add(grid);
        }
        createWorld();

        // --- Game Objects ---
        // 1. Player (동물 형태: 병아리/강아지 느낌의 귀여운 모습)
        const playerGroup = new THREE.Group();
        
        // Body
        const bodyGeo = new THREE.SphereGeometry(0.8, 16, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffdd00, roughness: 0.3 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.8;
        body.castShadow = true;
        playerGroup.add(body);

        // Eyes
        const eyeGeo = new THREE.SphereGeometry(0.1, 8, 8);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(0.3, 1.0, 0.65);
        const rightEye = leftEye.clone();
        rightEye.position.x = -0.3;
        playerGroup.add(leftEye);
        playerGroup.add(rightEye);

        // Beak / Nose
        const noseGeo = new THREE.ConeGeometry(0.15, 0.3, 8);
        const noseMat = new THREE.MeshStandardMaterial({ color: 0xff6600 });
        const nose = new THREE.Mesh(noseGeo, noseMat);
        nose.rotation.x = Math.PI / 2;
        nose.position.set(0, 0.8, 0.85);
        playerGroup.add(nose);

        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        // Carried Egg Object (hidden initially)
        const carriedEggGeo = new THREE.SphereGeometry(0.5, 16, 16);
        carriedEggGeo.scale(1, 1.3, 1);
        const carriedEggMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
        const carriedEgg = new THREE.Mesh(carriedEggGeo, carriedEggMat);
        carriedEgg.position.set(0, 2.2, 0);
        carriedEgg.castShadow = true;
        carriedEgg.visible = false;
        playerGroup.add(carriedEgg);

        // 2. Base Zone (알을 제출하는 곳)
        const baseZoneGeo = new THREE.CylinderGeometry(4, 4, 0.1, 32);
        const baseZoneMat = new THREE.MeshStandardMaterial({ color: 0x00ff88, transparent: true, opacity: 0.5 });
        const baseZone = new THREE.Mesh(baseZoneGeo, baseZoneMat);
        baseZone.position.set(0, 0.05, -15);
        scene.add(baseZone);

        // Base Marker
        const baseRing = new THREE.Mesh(
            new THREE.RingGeometry(3.8, 4, 32),
            new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide })
        );
        baseRing.rotation.x = Math.PI / 2;
        baseRing.position.set(0, 0.08, -15);
        scene.add(baseRing);

        // 3. Treadmill Zone (런닝머신)
        const treadmillGroup = new THREE.Group();
        const tmBase = new THREE.Mesh(
            new THREE.BoxGeometry(6, 0.3, 10),
            new THREE.MeshStandardMaterial({ color: 0x333333 })
        );
        tmBase.position.y = 0.15;
        tmBase.receiveShadow = true;
        treadmillGroup.add(tmBase);

        const tmBelt = new THREE.Mesh(
            new THREE.BoxGeometry(5, 0.32, 9),
            new THREE.MeshStandardMaterial({ color: 0x111111 })
        );
        tmBelt.position.y = 0.16;
        treadmillGroup.add(tmBelt);

        treadmillGroup.position.set(-15, 0, 0);
        scene.add(treadmillGroup);

        // 4. Gacha Egg Station (알 뽑기 상점)
        const gachaStationGroup = new THREE.Group();
        const pedestal = new THREE.Mesh(
            new THREE.CylinderGeometry(2, 2.5, 1, 16),
            new THREE.MeshStandardMaterial({ color: 0xffcc00 })
        );
        pedestal.position.y = 0.5;
        pedestal.castShadow = true;
        gachaStationGroup.add(pedestal);

        const displayEggGeo = new THREE.SphereGeometry(1, 16, 16);
        displayEggGeo.scale(1, 1.3, 1);
        const displayEgg = new THREE.Mesh(
            displayEggGeo,
            new THREE.MeshStandardMaterial({ color: 0xff5588, roughness: 0.3 })
        );
        displayEgg.position.y = 2.2;
        displayEgg.castShadow = true;
        gachaStationGroup.add(displayEgg);

        gachaStationGroup.position.set(15, 0, 0);
        scene.add(gachaStationGroup);

        // 5. Egg Pickup Field (알을 주울 수 있는 지역)
        const eggPickupGroup = new THREE.Group();
        const eggPickupPad = new THREE.Mesh(
            new THREE.CylinderGeometry(3, 3, 0.1, 32),
            new THREE.MeshStandardMaterial({ color: 0xffaa00, transparent: true, opacity: 0.6 })
        );
        eggPickupPad.position.y = 0.05;
        eggPickupGroup.add(eggPickupPad);

        const wildEgg = new THREE.Mesh(
            displayEggGeo,
            new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 })
        );
        wildEgg.position.y = 1.3;
        wildEgg.castShadow = true;
        eggPickupGroup.add(wildEgg);

        eggPickupGroup.position.set(0, 0, 20);
        scene.add(eggPickupGroup);

        // --- Pet System Visuals ---
        class PetMesh {
            constructor(petData, index) {
                this.data = petData;
                this.index = index;

                this.group = new THREE.Group();
                
                // Pet Body
                const geo = new THREE.SphereGeometry(0.5, 16, 16);
                const mat = new THREE.MeshStandardMaterial({ color: petData.color, roughness: 0.4 });
                this.mesh = new THREE.Mesh(geo, mat);
                this.mesh.position.y = 0.5;
                this.mesh.castShadow = true;
                this.group.add(this.mesh);

                // Ears (동물 느낌 내기)
                const earGeo = new THREE.ConeGeometry(0.15, 0.4, 8);
                const leftEar = new THREE.Mesh(earGeo, mat);
                leftEar.position.set(0.2, 0.9, 0);
                const rightEar = leftEar.clone();
                rightEar.position.x = -0.2;
                this.group.add(leftEar);
                this.group.add(rightEar);

                scene.add(this.group);

                this.timer = 0;
            }

            update(delta, playerPos) {
                // Follow Player
                const angle = (this.index / state.pets.length) * Math.PI * 2 + Date.now() * 0.002;
                const targetX = playerPos.x + Math.cos(angle) * 2.5;
                const targetZ = playerPos.z + Math.sin(angle) * 2.5;

                this.group.position.x += (targetX - this.group.position.x) * 0.1;
                this.group.position.z += (targetZ - this.group.position.z) * 0.1;
                this.group.position.y = Math.sin(Date.now() * 0.008 + this.index) * 0.2;

                // Gold Generation Timer
                this.timer += delta;
                if (this.timer >= 3) { // 3초마다 돈 버는 펫
                    this.timer = 0;
                    addGold(this.data.income);
                    spawnFloatingText(`+${this.data.income}`, this.group.position);
                }
            }

            destroy() {
                scene.remove(this.group);
            }
        }

        let petMeshes = [];

        function updatePetMeshes() {
            petMeshes.forEach(p => p.destroy());
            petMeshes = [];
            state.pets.forEach((petData, idx) => {
                petMeshes.push(new PetMesh(petData, idx));
            });
            document.getElementById('pet-count-display').innerText = `${state.pets.length}/${state.maxPets}`;
        }

        // --- Floating Text Effect for Pet Earnings ---
        function spawnFloatingText(text, worldPos) {
            // World to Screen coordinate conversion
            const vector = worldPos.clone();
            vector.y += 1.2; // 펫 머리 위
            vector.project(camera);

            const x = (vector.x * .5 + .5) * window.innerWidth;
            const y = (-(vector.y * .5) + .5) * window.innerHeight;

            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;

            document.getElementById('floating-text-container').appendChild(el);

            setTimeout(() => {
                el.remove();
            }, 1200);
        }

        // --- Input Handling ---
        const keys = {};
        window.addEventListener('keydown', (e) => {
            initAudio();
            keys[e.code] = true;
        });
        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // --- Game Logic Functions ---
        function addGold(amount) {
            state.gold += amount;
            document.getElementById('gold-display').innerText = state.gold;
            playCoinSound();
        }

        function checkStageProgress() {
            // 500골드마다 다음 단계로 진입
            const newStageIdx = Math.min(Math.floor(state.gold / 500), STAGES.length - 1);
            if (newStageIdx !== state.currentStageIdx) {
                state.currentStageIdx = newStageIdx;
                const stage = STAGES[newStageIdx];
                
                // 배경색 변경
                scene.background.setHex(stage.color);
                groundMaterial.color.setHex(stage.color);

                // UI 업데이트
                document.getElementById('stage-title-text').innerText = stage.name;
            }
        }

        // --- Gacha Modal System ---
        let gachaAutoCloseTimer = null;

        function openGachaModal() {
            document.getElementById('gacha-modal').style.display = 'block';
        }

        function closeGachaModal() {
            document.getElementById('gacha-modal').style.display = 'none';
            if (gachaAutoCloseTimer) clearTimeout(gachaAutoCloseTimer);
        }

        function buyPet() {
            if (state.gold < 100) {
                alert("골드가 부족합니다! (100 골드 필요)");
                return;
            }
            if (state.pets.length >= state.maxPets) {
                alert("펫 소지 칸이 가득 찼습니다!");
                return;
            }

            state.gold -= 100;
            document.getElementById('gold-display').innerText = state.gold;

            // 랜덤 펫 가챠
            const rand = Math.random();
            let selectedPet = PET_TYPES[0];
            if (rand > 0.95) selectedPet = PET_TYPES[3];
            else if (rand > 0.8) selectedPet = PET_TYPES[2];
            else if (rand > 0.5) selectedPet = PET_TYPES[1];

            state.pets.push(selectedPet);
            updatePetMeshes();

            const resultEl = document.getElementById('gacha-result');
            resultEl.innerText = `🎉 ${selectedPet.name} (${selectedPet.rarity}) 획득!`;
            resultEl.style.color = `#${selectedPet.color.toString(16)}`;

            // 펫 뽑은 후 1초 뒤 자동 나가기
            if (gachaAutoCloseTimer) clearTimeout(gachaAutoCloseTimer);
            gachaAutoCloseTimer = setTimeout(() => {
                closeGachaModal();
                resultEl.innerText = "?";
            }, 1000);
        }

        // --- Main Game Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // 1. Movement Logic
            let moveX = 0;
            let moveZ = 0;

            if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

            if (moveX !== 0 || moveZ !== 0) {
                const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
                const actualSpeed = state.currentSpeed;
                
                playerGroup.position.x += (moveX / len) * actualSpeed * delta;
                playerGroup.position.z += (moveZ / len) * actualSpeed * delta;

                // Look Direction
                const angle = Math.atan2(moveX, moveZ);
                playerGroup.rotation.y = angle;

                // Bounce Walking Anim
                playerGroup.position.y = Math.abs(Math.sin(Date.now() * 0.015)) * 0.3;
            } else {
                playerGroup.position.y = 0;
            }

            // Map Bounds
            playerGroup.position.x = Math.max(-48, Math.min(48, playerGroup.position.x));
            playerGroup.position.z = Math.max(-48, Math.min(48, playerGroup.position.z));

            // Camera Tracking
            camera.position.x = playerGroup.position.x;
            camera.position.z = playerGroup.position.z + 18;
            camera.position.y = playerGroup.position.y + 15;
            camera.lookAt(playerGroup.position.x, playerGroup.position.y, playerGroup.position.z);

            // 2. Treadmill Zone (속도 증가)
            const distToTM = playerGroup.position.distanceTo(treadmillGroup.position);
            if (distToTM < 4) {
                state.baseSpeed += delta * 8; // 런닝머신 위에서 속도 상승
                state.currentSpeed = state.hasEgg ? state.baseSpeed * 0.5 : state.baseSpeed;
                document.getElementById('speed-display').innerText = Math.floor(state.baseSpeed);

                // 속도가 올라갈 때마다 "똥!" 효과음 재생
                if (Date.now() - state.lastTreadmillStep > 180) {
                    playSpeedUpSound();
                    state.lastTreadmillStep = Date.now();
                }
            }

            // 3. Egg Pickup Zone
            const distToEggPad = playerGroup.position.distanceTo(eggPickupGroup.position);
            if (distToEggPad < 2.5 && !state.hasEgg) {
                state.hasEgg = true;
                carriedEgg.visible = false; // 등 뒤에 알 표시
                carriedEgg.visible = true;
                state.currentSpeed = state.baseSpeed * 0.5; // 알 들면 속도 감소
            }

            // 4. Base Zone (알 제출 & 원래 속도로 복구)
            const distToBase = playerGroup.position.distanceTo(baseZone.position);
            if (distToBase < 3.5) {
                if (state.hasEgg) {
                    state.hasEgg = false;
                    carriedEgg.visible = false;
                    
                    // 원래 속도로 즉시 회복!
                    state.currentSpeed = state.baseSpeed;
                    
                    // 알 제출 보상
                    addGold(50);
                }
            }

            // 5. Gacha Station Modal Trigger
            const distToGacha = playerGroup.position.distanceTo(gachaStationGroup.position);
            if (distToGacha < 3) {
                if (document.getElementById('gacha-modal').style.display !== 'block') {
                    openGachaModal();
                }
            }

            // Display Egg Rotation Animation
            displayEgg.rotation.y += delta * 1.5;
            wildEgg.rotation.y += delta * 2.0;

            // Update Pets
            petMeshes.forEach(pet => pet.update(delta, playerGroup.position));

            // Stage Check
            checkStageProgress();

            renderer.render(scene, camera);
        }

        // Window Resize Handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start Loop
        animate();
    </script>
</body>
</html>
